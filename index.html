                async removeUser(userId) {
                    const protectedUser = this.users.find(candidate => String(candidate.id) === String(userId));
                    if (this.isProtectedSystemOwner(protectedUser)) {
                        alert('حساب مدير النظام محمي ولا يمكن حذفه.');
                        return;
                    }
                    if (userId === 1) {
                        alert('لا يمكن حذف حساب المدير الأساسي');
                        return;
                    }
                    if (!confirm('هل تريد حذف هذا الحساب؟')) return;
                    const user = this.users.find(candidate => String(candidate.id) === String(userId));
                    if (!user) return;
                    if (isFirebaseConfigured) {
                        const confirmation = window.prompt('للحذف النهائي اكتب العبارة التالية كما هي: حذف الحساب');
                        if (confirmation !== 'حذف الحساب') {
                            alert('تم إلغاء الحذف: عبارة التأكيد غير صحيحة.');
                            return;
                        }
                    }
                    this.selfServiceAccountBusy = true;
                    this.selfServiceAccountMessage = 'جارٍ حذف هوية الحساب وعضويته فقط. لا تُحذف بيانات المرضى أو الزيارات.';
                    if (this.cloudSyncEnabled && clinicAccountGatewayUrl) {
                        try {
                            await this.callAdminApi('/api/admin/users/delete', { body: { uid: String(user.firebaseUid || user.id), confirmation: 'حذف الحساب' } });
                        } catch (error) {
                            this.selfServiceAccountMessage = error?.message || 'تعذر حذف الحساب. بقيت البيانات دون تغيير.';
                            this.selfServiceAccountBusy = false;
                            return;
                        }
                    }
                    this.users = this.users.filter(u => u.id !== userId);
                    delete this.userPermissionDrafts[userId];
                    this.recordLocalAccountAudit('حذف حساب محلي', user.email);
                    this.persistState();
                    const cloudResult = await this.persistUsersToCloudNow();
                    if (navigator.onLine && this.cloudSyncEnabled && !cloudResult.ok) {
                        this.selfServiceAccountMessage = 'حُذفت هوية الحساب وعضويته، وستُعاد مزامنة القائمة المحلية تلقائياً عند استقرار الاتصال.';
                    } else {
                        this.selfServiceAccountMessage = 'تم حذف حساب الفريق وعضويته فقط. بيانات المرضى والزيارات لم تُمس.';
                    }
                    this.selfServiceAccountBusy = false;
                },

                async toggleUserActive(userId) {
                    const protectedUser = this.users.find(candidate => String(candidate.id) === String(userId));
                    if (this.isProtectedSystemOwner(protectedUser)) {
                        alert('حساب مدير النظام محمي ولا يمكن إيقافه.');
                        return;
                    }
                    if (isFirebaseConfigured && clinicAccountGatewayUrl) return this.setManagedFirebaseUserDisabled(userId);
                    if (userId === 1) {
                        alert('لا يمكن إيقاف حساب المدير الأساسي');
                        return;
                    }
                    const user = this.users.find(u => u.id === userId);
                    if (!user) return;
                    const previousActive = user.active;
                    user.active = !user.active;
                    if (this.cloudSyncEnabled) {
                        const updated = await this.syncUserMembership(userId, { silent: true });
                        if (!updated) user.active = previousActive;
                    } else {
                        this.recordLocalAccountAudit(user.active ? 'تفعيل حساب محلي' : 'إيقاف حساب محلي', user.email);
                    }
                    this.persistState();
                },

                async promoteToAdmin(userId) {
                    const protectedUser = this.users.find(candidate => String(candidate.id) === String(userId));
                    if (this.isProtectedSystemOwner(protectedUser)) {
                        alert('حساب مدير النظام محمي ولا يمكن تعديل دوره.');
                        return;
                    }
                    if (isFirebaseConfigured && clinicAccountGatewayUrl) return this.updateManagedFirebaseRole(userId, 'admin');
                    const user = this.users.find(u => u.id === userId);
                    if (!user) return;
                    if (!confirm(`هل تريد منح "${user.fullName}" صلاحيات إدارة كاملة (مدير آخر)؟`)) return;
                    const previousRole = user.role;
                    const previousPermissions = { ...user.permissions };
                    user.role = 'admin';
                    const fullPermissions = {};
                    this.permissionModules.forEach(m => { fullPermissions[m.key] = true; });
                    user.permissions = fullPermissions;
                    this.userPermissionDrafts[userId] = { ...fullPermissions };
                    if (this.cloudSyncEnabled) {
                        const updated = await this.syncUserMembership(userId, { silent: true });
                        if (!updated) {
                            user.role = previousRole;
                            user.permissions = previousPermissions;
                            this.userPermissionDrafts[userId] = { ...previousPermissions };
                            this.persistState();
                            return;
                        }
                    } else {
                        this.recordLocalAccountAudit('ترقية حساب محلي لمدير', user.email);
                    }
                    this.persistState();
                },

                async saveUserPermissions(userId) {
                    const protectedUser = this.users.find(candidate => String(candidate.id) === String(userId));
                    if (this.isProtectedSystemOwner(protectedUser)) {
                        alert('حساب مدير النظام محمي ولا يمكن تعديل صلاحياته.');
                        return;
                    }
                    if (isFirebaseConfigured && clinicAccountGatewayUrl) return this.saveManagedFirebasePermissions(userId);
                    const user = this.users.find(u => u.id === userId);
                    if (!user) return;
                    const fullPermissions = {};
                    this.permissionModules.forEach(m => { fullPermissions[m.key] = true; });
                    user.permissions = user.id === 1 || user.role === 'admin'
                        ? fullPermissions
                        : { ...this.userPermissionDrafts[userId] };
                    this.userPermissionDrafts[userId] = { ...user.permissions };
                    if (this.currentUser && this.currentUser.id === userId) {
                        this.currentUser = user;
                    }
                    this.userSaveFeedback[userId] = true;
                    setTimeout(() => { this.userSaveFeedback[userId] = false; }, 2000);
                    this.persistState();
                    const cloudResult = await this.persistUsersToCloudNow();
                    if (navigator.onLine && this.cloudSyncEnabled && !cloudResult.ok) {
                        alert('تم تعديل الصلاحيات محلياً فقط ولم يؤكَّد حفظها في السحابة.');
                    }
                },

                apiReadyMessage() {
                    return 'إدارة حسابات الفريق تحتاج خدمة الإدارة الآمنة. لم يُحفظ أي تعديل محلياً.';
                },
                hasVerifiedCloudSession() {
                    const operationalReady = !this.isOperationalDocumentSyncActive()
                        || (this.v2OperationalReady === true && this.cloudServerHydrated === true);
                    return Boolean(this.cloudAuthReady && this.cloudMembershipReady && this.cloudServerHydrated === true && operationalReady && navigator.onLine);
                },
                cloudConnectionState() {
                    if (!this.hasVerifiedCloudSession()) {
                        return this.cloudStatus === 'connecting' ? 'connecting' : 'offline';
                    }
                    return this.cloudStatus === 'syncing' ? 'syncing' : 'online';
                },
                cloudConnectionLabel() {
                    const state = this.cloudConnectionState();
                    if (state === 'online') return '🟢 متصل';
                    if (state === 'syncing') return '🔵 جارٍ المزامنة';
                    if (this.syncSafetyHold || this.cloudStatus === 'blocked') return '🔴 حجز أمان — المزامنة متوقفة';
                    if (state === 'connecting') return '🔵 جارٍ الاتصال';
                    return '🟡 وضع محلي - بانتظار الاتصال';
                },
                adminPermissionPayload(localPermissions = {}) {
                    return {
                        dashboard: localPermissions.dashboard === true,
                        patients: localPermissions.patients === true,
                        clinicVisits: localPermissions.newVisit === true,
                        dentalVisits: false,
                        operationsVisits: false,
                        labsVisits: false,
                        radiologyVisits: false,
                        appointments: localPermissions.appointments === true,
                        waitingQueue: localPermissions.waitingQueue === true,
                        followUps: localPermissions.followUps === true,
                        income: localPermissions.invoices === true,
                        expenses: localPermissions.expenses === true,
                        payroll: false,
                        reports: localPermissions.reports === true,
                        pharmacy: localPermissions.pharmacy === true,
                        prescriptionSettings: localPermissions.prescriptionSettings === true,
                        settings: localPermissions.settings === true,
                        usersManagement: localPermissions.settings === true,
                        permissionsManagement: localPermissions.settings === true,
                        backup: localPermissions.settings === true,
                        archive: false,
                    };
                },
                localPermissionsFromAdmin(remote = {}) {
                    const read = (...keys) => keys.some(key => remote?.[key] === true);
                    return {
                        dashboard: read('dashboard'),
                        newVisit: read('clinicVisits', 'newVisit'),
                        appointments: read('appointments'),
                        waitingQueue: read('waitingQueue'),
                        followUps: read('followUps'),
                        patients: read('patients'),
                        invoices: read('income', 'invoices'),
                        expenses: read('expenses'),
                        reports: read('reports'),
                        pharmacy: read('pharmacy'),
                        prescriptionSettings: read('prescriptionSettings'),
                        settings: read('settings'),
                    };
                },
                uiRoleForFirebase(role) {
                    const value = String(role || '').toLowerCase();
                    if (value === 'owner' || value === 'admin') return value;
                    if (value === 'clinician') return 'طبيب';
                    if (value === 'accountant') return 'محاسب';
                    if (value === 'assistant') return 'مساعد';
                    return 'موظف استقبال';
                },
                firebaseRolesForUi(role) {
                    const value = String(role || 'موظف استقبال');
                    if (value === 'طبيب') return { role: 'clinician', clinicRole: 'clinician' };
                    if (value === 'محاسب') return { role: 'accountant', clinicRole: 'assistant' };
                    if (value === 'مساعد') return { role: 'assistant', clinicRole: 'assistant' };
                    if (value === 'admin') return { role: 'admin', clinicRole: 'admin' };
                    return { role: 'staff', clinicRole: 'assistant' };
                },
                async callAdminApi(path, options = {}) {
                    if (!clinicAccountGatewayUrl || !firebaseAuth?.currentUser) throw new Error(this.apiReadyMessage());
                    const token = await firebaseAuth.currentUser.getIdToken(true);
                    const response = await fetch(`${clinicAccountGatewayUrl}${path}`, {
                        method: options.method || 'POST',
                        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', 'X-Clinic-Id': String(this.cloudClinicId), ...(options.headers || {}) },
                        body: options.body === undefined ? undefined : JSON.stringify(options.body),
                    });
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(payload?.message || 'تعذر إكمال عملية إدارة المستخدمين.');
                    return payload;
                },
                normalizeManagedFirebaseUser(profile) {
                    return this.withCompatiblePermissions({
                        id: String(profile.uid || profile.id || profile.username || profile.email), firebaseUid: String(profile.uid || profile.firebaseUid || ''),
                        fullName: String(profile.displayName || profile.fullName || profile.name || profile.username || profile.email || 'مستخدم النظام'),
                        email: String(profile.username || profile.email || profile.firebaseEmail || ''), role: this.uiRoleForFirebase(profile.globalRole || profile.role || profile.clinicRole),
                        active: profile.status ? profile.status === 'active' : profile.active !== false,
                        permissions: this.localPermissionsFromAdmin(profile.permissions || {}),
                        firebaseAuthStatus: 'active',
                    });
                },
                isProtectedSystemOwner(user) {
                    return String(user?.role || '').toLowerCase() === 'owner';
                },
                async loadManagedFirebaseUsers() {
                    const result = await this.callAdminApi('/api/admin/users', { method: 'GET' });
                    this.users = (result.users || []).map(profile => this.normalizeManagedFirebaseUser(profile));
                    this.userPermissionDrafts = Object.fromEntries(this.users.map(user => [user.id, { ...user.permissions }]));
                    this.persistState();
                    return this.users;
                },
                async createManagedFirebaseUser() {
                    const username = String(this.newUserForm.username || '').trim().toLowerCase();
                    const password = String(this.newUserForm.password || '').trim();
                    const fullName = String(this.newUserForm.fullName || username).trim();
                    if (!username || !password) { alert('اكتب اسم المستخدم وكلمة المرور الأولية.'); return; }
                    if (username.includes('@')) { alert('اكتب اسم مستخدم فقط دون بريد إلكتروني.'); return; }
                    if (password.length < 6) { alert('كلمة المرور يجب ألا تقل عن 6 أحرف.'); return; }

                    if (this.users.some(u => String(u.email || '').trim().toLowerCase() === username)) {
                        alert('يوجد بالفعل حساب بنفس اسم المستخدم.');
                        return;
                    }

                    const mapped = this.firebaseRolesForUi(this.newUserForm.role);
                    this.selfServiceAccountBusy = true;

                    if (isFirebaseConfigured && clinicAccountGatewayUrl) {
                        try {
                            await this.callAdminApi('/api/admin/users/create', { body: {
                                username, displayName: fullName, password, clinicId: this.cloudClinicId,
                                role: mapped.role, clinicRole: mapped.clinicRole,
                                permissions: this.adminPermissionPayload(this.newUserForm.permissions),
                            }});
                            await this.loadManagedFirebaseUsers();
                            this.newUserForm = { fullName: '', username: '', password: '', role: 'موظف استقبال', permissions: { dashboard: true, newVisit: true, appointments: true, waitingQueue: false, followUps: true, patients: true, invoices: false, expenses: false, reports: false, pharmacy: false, prescriptionSettings: false, settings: false } };
                            this.showFlashNotice('تم إنشاء حساب الفريق وحفظ صلاحياته بنجاح.');
                        } catch (error) { 
                            this.showFlashNotice(error?.message || this.apiReadyMessage(), 'error'); 
                        } finally { 
                            this.selfServiceAccountBusy = false; 
                        }
                        return;
                    }

                    try {
                        const internalEmail = await firebaseEmailForUsername(username);
                        let newUid = `user-${Date.now()}`;
                        let createdInAuth = false;

                        if (window.firebase && isFirebaseConfigured) {
                            try {
                                const secondaryApp = firebase.initializeApp(window.SOLI_FIREBASE_CONFIG, `Secondary_${Date.now()}`);
                                const secondaryAuth = secondaryApp.auth();
                                const cred = await secondaryAuth.createUserWithEmailAndPassword(internalEmail, password);
                                newUid = cred.user.uid;
                                createdInAuth = true;
                                await secondaryAuth.signOut().catch(() => {});
                                await secondaryApp.delete().catch(() => {});
                            } catch (authError) {
                                console.warn('Firebase Auth user creation notice:', authError);
                                if (authError.code === 'auth/email-already-in-use') {
                                    throw new Error('هذا الحساب موجود بالفعل في Firebase Authentication.');
                                } else if (authError.code === 'auth/weak-password') {
                                    throw new Error('كلمة المرور يجب ألا تقل عن 6 أحرف.');
                                } else {
                                    throw new Error(this.firebaseIdentityErrorMessage(authError));
                                }
                            }
                        }

                        const localCredential = await this.buildLocalCredential(password);
                        const newUser = this.withCompatiblePermissions({
                            id: newUid,
                            firebaseUid: createdInAuth ? newUid : undefined,
                            fullName,
                            email: username,
                            firebaseEmail: internalEmail,
                            role: this.newUserForm.role,
                            active: true,
                            localCredential,
                            permissions: { ...this.newUserForm.permissions },
                            firebaseAuthStatus: 'active'
                        });

                        if (firestoreDB && createdInAuth) {
                            await firestoreDB.collection('users').doc(newUid).set({
                                username,
                                displayName: fullName,
                                globalRole: mapped.role,
                                status: 'active',
                                permissions: this.adminPermissionPayload(this.newUserForm.permissions),
                                createdAt: new Date().toISOString()
                            }, { merge: true }).catch(err => console.warn('Could not write users doc:', err));

                            await this.getV2ClinicRef().collection('members').doc(newUid).set({
                                status: 'active',
                                role: mapped.clinicRole || 'assistant',
                                createdAt: new Date().toISOString(),
                                createdBy: String(this.currentUser?.id || 'admin'),
                                firebaseEmail: internalEmail,
                                localUserId: newUid
                            }, { merge: true }).catch(err => console.warn('Could not write members doc:', err));
                        }

                        this.users.push(newUser);
                        this.userPermissionDrafts[newUser.id] = { ...newUser.permissions };
                        this.persistState();
                        await this.persistUsersToCloudNow();

                        this.newUserForm = { fullName: '', username: '', password: '', role: 'موظف استقبال', permissions: { dashboard: true, newVisit: true, appointments: true, waitingQueue: false, followUps: true, patients: true, invoices: false, expenses: false, reports: false, pharmacy: false, prescriptionSettings: false, settings: false } };
                        this.showFlashNotice('تم إنشاء الحساب في Firebase Authentication وتفعيل صلاحياته بنجاح.');
                    } catch (err) {
                        alert(err?.message || 'تعذر إنشاء الحساب.');
                    } finally {
                        this.selfServiceAccountBusy = false;
                    }
                },
                async setManagedFirebaseUserDisabled(userId) {
                    const user = this.users.find(candidate => String(candidate.id) === String(userId));
                    if (!user) return;
                    if (this.isProtectedSystemOwner(user)) { alert('حساب مدير النظام محمي ولا يمكن إيقافه أو تعديله من هذه البطاقة.'); return; }
                    if (String(user.id) === String(this.currentUser?.id)) { alert('لا يمكنك إيقاف حسابك من الجلسة الحالية.'); return; }
                    this.selfServiceAccountBusy = true;
                    try {
                        await this.callAdminApi('/api/admin/users/disable', { body: { uid: user.id, disabled: user.active } });
                        await this.loadManagedFirebaseUsers();
                        this.showFlashNotice(user.active ? 'تم إيقاف الحساب بنجاح.' : 'تم تفعيل الحساب بنجاح.');
                    } catch (error) { this.showFlashNotice(error?.message || this.apiReadyMessage(), 'error'); }
                    finally { this.selfServiceAccountBusy = false; }
                },
                async updateManagedFirebaseRole(userId, role) {
                    const user = this.users.find(candidate => String(candidate.id) === String(userId));
                    if (this.isProtectedSystemOwner(user)) { alert('حساب مدير النظام محمي ولا يمكن تعديل صلاحياته.'); return; }
                    this.selfServiceAccountBusy = true;
                    try {
                        await this.callAdminApi('/api/admin/users/update', { body: { uid: String(userId), role } });
                        await this.loadManagedFirebaseUsers();
                        this.showFlashNotice('تم تحديث دور المستخدم بنجاح.');
                    } catch (error) { this.showFlashNotice(error?.message || this.apiReadyMessage(), 'error'); }
                    finally { this.selfServiceAccountBusy = false; }
                },
                async saveManagedFirebasePermissions(userId) {
                    const user = this.users.find(candidate => String(candidate.id) === String(userId));
                    if (!user) return;
                    if (this.isProtectedSystemOwner(user)) { alert('حساب مدير النظام محمي ولا يمكن تعديل صلاحياته.'); return; }
                    const mapped = this.firebaseRolesForUi(user.role);
                    this.selfServiceAccountBusy = true;
                    try {
                        await this.callAdminApi('/api/admin/users/change-permissions', { body: {
                            uid: user.id, clinicId: this.cloudClinicId, clinicRole: mapped.clinicRole,
                            permissions: this.adminPermissionPayload(this.userPermissionDrafts[user.id] || {}),
                        }});
                        await this.loadManagedFirebaseUsers();
                        this.showFlashNotice('تم حفظ الصلاحيات بنجاح.');
                    } catch (error) { this.showFlashNotice(error?.message || this.apiReadyMessage(), 'error'); }
                    finally { this.selfServiceAccountBusy = false; }
                },

                // Maps each page to the permission required to view it, so navigation can never
                // land an employee on a section outside what the admin granted them.
                // 'patientForm' is intentionally excluded — it's reachable either via 'newVisit'
                // (adding a fresh visit) or via 'patients' (editing from the list); both call
                // openPatientFormPage()/startEditPatient() directly rather than navigateTo().
                viewPermissionMap: {
                    dashboard: 'dashboard',
                    newVisit: 'newVisit',
                    followUps: 'followUps',
                    waitingQueue: 'waitingQueue',
                    appointments: 'appointments',
                    patientsList: 'patients',
                    medicalRecord: 'patients',
                    invoices: 'invoices',
                    expenses: 'expenses',
                    reports: 'reports',
                    pharmacy: 'pharmacy',
                    prescriptionSettings: 'prescriptionSettings',
                    settings: 'settings'
                },

                // Lands the given user on the first section they have access to. Some permission
                // entries (like "newVisit") aren't real pages — they're direct-action shortcuts —
                // so they need to trigger their action instead of setting an invalid currentView.
                landOnAllowedPage(user) {
                    const firstAllowed = this.permissionModules.find(m => user.permissions[m.key]);
                    if (!firstAllowed) { this.currentView = 'dashboard'; return; }
                    if (firstAllowed.key === 'newVisit') {
                        this.openPatientFormPage();
                    } else if (firstAllowed.key === 'waitingQueue') {
                        this.currentView = 'waitingQueue';
                    } else {
                        this.currentView = firstAllowed.key;
                    }
                },

                firebaseEmailForUser(value) {
                    const normalized = (value || '').trim().toLowerCase();
                    if (normalized.includes('@')) return normalized;
                    const safeLocalPart = Array.from(normalized)
                        .map(character => /[a-z0-9._+-]/.test(character)
                            ? character
                            : `u${character.codePointAt(0).toString(16)}`)
                        .join('')
                        .replace(/-+/g, '-')
                        .replace(/^-|-$/g, '') || 'user';
                    return `${safeLocalPart}@solimedical.local`;
                },
                resolveFirebaseLoginEmail(login) {
                    const normalizedLogin = String(login || '').trim().toLowerCase();
                    if (!normalizedLogin) return '';
                    const matchedUser = (this.users || []).find(user => {
                        const localEmail = String(user?.email || '').trim().toLowerCase();
                        const firebaseEmail = String(user?.firebaseEmail || '').trim().toLowerCase();
                        return normalizedLogin === localEmail ||
                            normalizedLogin === firebaseEmail ||
                            normalizedLogin === this.firebaseEmailForUser(localEmail);
                    });
                    if (matchedUser) {
                        return String(matchedUser.firebaseEmail || this.firebaseEmailForUser(matchedUser.email))
                            .trim()
                            .toLowerCase();
                    }
                    return this.firebaseEmailForUser(normalizedLogin);
                },

                async createFirebaseIdentityForNewUser(localUser, firebasePassword = '') {
                    const password = String(firebasePassword || '');
                    if (!localUser || password.length < 6) {
                        return { ok: false, message: 'كلمة مرور Firebase الأولية يجب أن تكون 6 أحرف أو أرقام على الأقل.' };
                    }
                    try {
                        const result = await this.callClinicAccountGateway('upsert', localUser, { password });
                        localUser.firebaseUid = result.uid;
                        localUser.firebaseAuthStatus = result.status;
                        return { ok: true, uid: result.uid };
                    } catch (error) {
                        localUser.firebaseAuthStatus = 'not_provisioned';
                        return { ok: false, message: error?.message || 'تعذر إنشاء هوية Firebase.' };
                    }
                },

                get firebaseMigrationUser() {
                    return this.users.find(u => String(u.id) === String(this.firebaseMigrationUserId)) || null;
                },

                get firebaseMigrationEmail() {
                    return this.firebaseMigrationUser ? this.firebaseEmailForUser(this.firebaseMigrationUser.email) : '';
                },

                openAppointmentsPage(date = null) {
                    const user = this.currentUser ? this.withCompatiblePermissions(this.currentUser) : null;
                    if (user) this.currentUser = user;
                    const permissions = user?.permissions || {};
                    const canOpen = user?.role === 'admin' || user?.role === 'owner' || permissions.appointments;
                    if (!canOpen) {
                        this.landOnAllowedPage(user);
                        this.mobileMenuOpen = false;
                        return;
                    }
                    this.selectedAppointmentDate = date || this.selectedAppointmentDate || new Date().toISOString().slice(0, 10);
                    this.appointmentForm.date = this.selectedAppointmentDate;
                    // تعيين الصفحة مباشرة يمنع أي حالة صلاحيات قديمة من إعادة التوجيه
                    // إلى لوحة التحكم أثناء تحديث currentUser من Firestore.
                    this.currentView = 'appointments';
                    localStorage.setItem('soliLastSection', 'appointments');
                    this.mobileMenuOpen = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    this.$nextTick(() => {
                        this.renderBookingShareQr();
                        this.renderIcons();
                    });
                },
                navigateTo(view, options = {}) {
                    const requiredPermission = this.viewPermissionMap[view];
                    const compatibleUser = this.currentUser ? this.withCompatiblePermissions(this.currentUser) : null;
                    if (compatibleUser) this.currentUser = compatibleUser;
                    if (compatibleUser && requiredPermission && !compatibleUser.permissions[requiredPermission]) {
                        // Not allowed here — send them to the first section they DO have access to.
                        this.landOnAllowedPage(this.currentUser);
                        this.mobileMenuOpen = false;
                        return;
                    }
                    const previousView = this.currentView;
                    if (!options.replace && previousView && previousView !== view) {
                        this.navigationHistory.push(previousView);
                        this.navigationHistory = this.navigationHistory.slice(-20);
                    }
                        this.currentView = view;
                        if (view === 'settings') {
                            this.$nextTick(() => document.querySelectorAll('.settings-accordion[open]').forEach(card => card.removeAttribute('open')));
                            if (isFirebaseConfigured && clinicAccountGatewayUrl && ['admin', 'owner'].includes(String(this.currentUser?.role || '').toLowerCase())) {
                                this.loadManagedFirebaseUsers().catch(error => console.warn('تعذر تحديث قائمة مستخدمي Firebase:', error));
                            }
                        }
                    this.mobileMenuOpen = false;
                    localStorage.setItem('soliLastSection', view);

                archiveEligibleAppointments() {

                    if (this.appointmentArchiveBusy) return;
                    const cutoff = new Date();
                    cutoff.setMonth(cutoff.getMonth() - 6);
                    const cutoffDate = cutoff.toISOString().slice(0, 10);
                    const eligible = (this.appointments || []).filter(item => !item.archivedAt && ['completed', 'cancelled'].includes(item.status) && item.date && item.date < cutoffDate);
                    if (!eligible.length) { alert('لا توجد مواعيد مكتملة أو ملغاة أقدم من ستة أشهر للأرشفة.'); return; }
                    if (!confirm(`سيُخفى ${eligible.length} موعداً قديماً من العرض اليومي فقط. لن يُحذف أي موعد أو مريض أو فاتورة. هل تريد المتابعة؟`)) return;
                    this.appointmentArchiveBusy = true;
                    const archivedAt = new Date().toISOString();
                    const eligibleIds = new Set(eligible.map(item => String(item.id)));
                    this.appointments = (this.appointments || []).map(item => eligibleIds.has(String(item.id)) ? { ...item, archivedAt, archivedBy: this.currentUser?.id || 'admin', archiveReason: 'completed_or_cancelled_older_than_six_months' } : item);
                    this.createArchiveManifest('appointments', eligible, 'completed_or_cancelled_older_than_six_months');
                    this.recordAudit('أرشفة مواعيد', `تمت أرشفة عرض ${eligible.length} موعداً؛ السجل محفوظ ويمكن استعادته.`);

                    const eligible = (this.waitingQueue || []).filter(item => !item.archivedAt && item.createdAt && new Date(item.createdAt) < cutoff && !['waiting', 'in_consultation'].includes(item.status));
                    if (!eligible.length) { alert('لا توجد عناصر قديمة غير نشطة في قائمة الانتظار للأرشفة.'); return; }
                    if (!confirm(`سيُخفى ${eligible.length} عنصراً غير نشط من قائمة الانتظار. لن يُحذف أي سجل. هل تريد المتابعة؟`)) return;
                    this.waitingQueueArchiveBusy = true;
                    const ids = new Set(eligible.map(item => String(item.id)));
                    const archivedAt = new Date().toISOString();
                    this.waitingQueue = (this.waitingQueue || []).map(item => ids.has(String(item.id)) ? { ...item, archivedAt, archivedBy: this.currentUser?.id || 'admin', archiveReason: 'inactive_older_than_thirty_days' } : item);
                    this.createArchiveManifest('waitingQueue', eligible, 'inactive_older_than_thirty_days');

                prepareWhatsAppAppointment() {

                addAppointment() {
                    const form = this.appointmentForm || {};
                    const patientName = String(form.patientName || '').trim();
                    if (!patientName || !form.date || !form.time) { alert('اكتب اسم المريض والتاريخ والوقت أولاً.'); return; }
                    const validPhone = this.validateAndNormalizePhone(form.phone);
                    if (validPhone === null) return;
                    form.phone = validPhone;
                    const patient = (this.patients || []).find(item => String(item.fullName || '').trim() === patientName || (form.phone && String(item.phone || '').trim() === String(form.phone).trim()));
                    const allowedStatuses = new Set(this.appointmentStatusOptions.map(item => item.key));
                    const status = allowedStatuses.has(form.status) ? form.status : 'scheduled';
                    const appointment = { id: 'APT-' + Date.now(), patientId: patient?.id || null, patientName, phone: String(form.phone || patient?.phone || '').trim(), date: form.date, time: form.time, visitType: form.visitType || 'كشف', notes: String(form.notes || '').trim(), status, source: form.source === 'whatsapp' ? 'whatsapp' : 'manual', createdAt: new Date().toISOString() };
                    this.appointments = [appointment, ...(this.appointments || [])];
                    this.selectedAppointmentDate = appointment.date;
                    this.resetAppointmentForm();
                    if (['waiting', 'in_consultation', 'completed'].includes(status)) {
                        this.ensureAppointmentFinancialLink(appointment);
                        if (status === 'waiting' || status === 'in_consultation') this.ensureAppointmentQueueLink(appointment);
                        if (status === 'completed') this.completeAppointment(appointment);
                    }
                    this.recordAudit('إضافة موعد', patientName + ' - ' + appointment.date + ' ' + appointment.time);
                    this.persistState();
                    this.queueCloudSync();
                },
                ensureAppointmentPatient(appointment) {
                    if (!appointment) return null;
                    let patient = this.getPatientById(appointment.patientId);
                    if (!patient) {
                        patient = (this.patients || []).find(item => String(item.fullName || '').trim() === String(appointment.patientName || '').trim() || (appointment.phone && String(item.phone || '').trim() === String(appointment.phone).trim()));
                    }
                    if (!patient) {
                        patient = { id: 'PAT-' + Date.now(), fullName: appointment.patientName, phone: appointment.phone || '', age: '', gender: '', bloodType: '', visitType: appointment.visitType || 'كشف', selectedSymptoms: [], selectedChronicDiseases: [], records: [] };
                        this.patients.unshift(patient);
                    }
                    appointment.patientId = patient.id;
                    return patient;
                },
                ensureAppointmentFinancialLink(appointment) {
                    if (!appointment) return null;
                    const appointmentId = appointment.id || appointment.appointmentId;
                    if (!appointmentId) return null;
                    const patient = this.ensureAppointmentPatient(appointment);
                    let invoice = (this.invoices || []).find(item => String(item.appointmentId || '') === String(appointmentId));
                    if (!invoice) {
                        const amount = Number(this.visitTypePrices?.[appointment.visitType] || 300);
                        invoice = { id: 'INV-APT-' + Date.now(), appointmentId, patientId: patient?.id || appointment.patientId || null, waitingQueueId: appointment.waitingQueueId || null, source: 'appointment', patientName: appointment.patientName, serviceName: `رسوم ${appointment.visitType || 'كشف'} طبي`, amount, discount: 0, tax: 0, total: amount, date: appointment.date || new Date().toISOString().slice(0, 10), status: 'مدفوعة' };
                        this.invoices.unshift(invoice);
                    }
                    appointment.invoiceId = invoice.id;
                    return invoice;
                },
                ensureAppointmentQueueLink(appointment) {
                    if (!appointment) return null;
                    const invoice = this.ensureAppointmentFinancialLink(appointment);
                    let queueItem = (this.waitingQueue || []).find(item => String(item.appointmentId || '') === String(appointment.id));
                    if (!queueItem) {
                        queueItem = { id: 'WQ-' + Date.now(), appointmentId: appointment.id, patientId: appointment.patientId, patientName: appointment.patientName, phone: appointment.phone || '', visitType: appointment.visitType || 'كشف', invoiceId: invoice?.id || null, symptom: `زيارة ${appointment.visitType || 'كشف'}`, clinic: 'عيادة الطبيب', status: appointment.status === 'in_consultation' ? 'in_consultation' : 'waiting', createdAt: new Date().toISOString() };
                        this.waitingQueue.unshift(queueItem);
                    } else {
                        queueItem.patientId = appointment.patientId;
                        queueItem.invoiceId = invoice?.id || queueItem.invoiceId;
                        queueItem.status = appointment.status === 'in_consultation' ? 'in_consultation' : queueItem.status || 'waiting';
                    }
                    appointment.waitingQueueId = queueItem.id;
                    this.announceWaitingArrival(queueItem, 'appointment_check_in');
                    return queueItem;
                },
                completeAppointment(appointment) {
                    if (!appointment) return false;
                    this.ensureAppointmentFinancialLink(appointment);
                    const patient = this.ensureAppointmentPatient(appointment);
                    this.waitingQueue = (this.waitingQueue || []).filter(item => String(item.appointmentId || '') !== String(appointment.id));
                    appointment.status = 'completed';
                    appointment.completedAt = appointment.completedAt || new Date().toISOString();
                    this.archiveAppointmentFromActiveCalendar(appointment, 'visit_completed');
                    this.recordAudit('إكمال موعد', `${appointment.patientName} — اكتمل الموعد وحُفظ في السجل${patient ? ' وتم تثبيت التحصيل' : ''}`);
                    return true;
                },
                archiveAppointmentFromActiveCalendar(appointment, reason = 'visit_started') {
                    if (!appointment || appointment.archivedAt) return false;
                    appointment.archivedAt = new Date().toISOString();
                    appointment.archivedBy = this.currentUser?.id || 'system';
                    appointment.archiveReason = reason;
                    return true;
                },
                appointmentStatusBadgeClass(status) {
                    return ({
                        pending_confirmation: 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300',
                        scheduled: 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300',
                        waiting: 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300',
                        in_consultation: 'bg-violet-100 text-violet-700 dark:bg-violet-900/30 dark:text-violet-300',
                        completed: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300',
                        cancelled: 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300'
                    })[status] || 'bg-slate-100 text-slate-600';
                },
                getBookingShareUrl() {
                    const base = new URL(window.location.href);
                    base.search = '';
                    base.hash = '';
                    base.searchParams.set('book', '');
                    const clinic = this.clinics?.[0] || {};

                },
                renderBookingShareQr() {
                    const target = document.getElementById('bookingShareQrCode');
                    if (!target) return;
                    target.innerHTML = '';
                    if (!window.QRCode) return;
                    new QRCode(target, {

                    });
