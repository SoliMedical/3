        const firebaseEmailForUsername = async (value) => {
            const normalized = String(value || '').normalize('NFKC').trim().replace(/\s+/g, ' ').toLocaleLowerCase();
            if (!/^[\p{L}\p{N}][\p{L}\p{N} ._-]{1,78}[\p{L}\p{N}]$/u.test(normalized)) {
                throw new Error('اسم المستخدم غير صالح.');
            }
            const encoded = new TextEncoder().encode(normalized);
            const digest = await crypto.subtle.digest('SHA-256', encoded);
            const hash = [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, '0')).join('').slice(0, 40);
            return `u-${hash}@soli.local`;
        };

        const validateEgyptianPhone = (value) => {
            const westernDigits = String(value || '')
                .replace(/[٠-٩]/g, digit => '٠١٢٣٤٥٦٧٨٩'.indexOf(digit))
                .replace(/[۰-۹]/g, digit => '۰۱۲۳۴۵۶۷۸۹'.indexOf(digit));
            let normalized = westernDigits.replace(/\D/g, '');
            if (normalized.startsWith('00')) normalized = normalized.slice(2);
            if (normalized.startsWith('20')) normalized = '0' + normalized.slice(2);
            return /^01(?:0|1|2|5)\d{8}$/.test(normalized) ? normalized : null;

        });
        const SoliInterface = (() => {
            let currentLanguage = 'ar';
            let animationFrame = null;
            const translationEntries = Object.entries(SOLI_ENGLISH_INTERFACE).sort((a, b) => b[0].length - a[0].length);
            const translate = (value, language = currentLanguage) => {
                const source = String(value || '').trim();
                if (language !== 'en' || !source) return value;
                const exact = SOLI_ENGLISH_INTERFACE[source];
                if (exact) return exact;
                // Translate known UI phrases inside composed labels while leaving patient-entered text intact.
                return translationEntries.reduce((result, [from, to]) => result.includes(from) ? result.split(from).join(to) : result, source);
            };
            const applyLanguage = (language = currentLanguage) => {
                if (!document.body) return;
                currentLanguage = language === 'en' ? 'en' : 'ar';
                const isEnglish = currentLanguage === 'en';
                document.documentElement.lang = isEnglish ? 'en' : 'ar';
                document.documentElement.dir = isEnglish ? 'ltr' : 'rtl';
                document.documentElement.classList.toggle('soli-ltr', isEnglish);
                document.documentElement.classList.toggle('soli-rtl', !isEnglish);
                document.querySelectorAll('[data-soli-interface-root], [data-soli-interface-surface]').forEach(root => {
                    root.setAttribute('dir', isEnglish ? 'ltr' : 'rtl');
                    root.setAttribute('lang', isEnglish ? 'en' : 'ar');
                });
                document.querySelectorAll('[dir="rtl"], [dir="ltr"]').forEach(element => {
                    if (element.closest('[data-soli-preserve-direction]')) return;
                    element.setAttribute('dir', isEnglish ? 'ltr' : 'rtl');
                });
                document.title = translate('Soli Medical - نظام إدارة عيادة الطبيب الواحد', currentLanguage);
                const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
                    acceptNode(node) {
                        const parent = node.parentElement;
                        return parent && !parent.closest('script, style, [data-soli-i18n-skip]') && String(node.nodeValue || '').trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                    }
                });
                const nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(node => {
                    const original = node.__soliOriginalText ?? node.nodeValue;
                    node.__soliOriginalText = original;
                    const prefix = String(original).match(/^\s*/)?.[0] || '';
                    const suffix = String(original).match(/\s*$/)?.[0] || '';
                    const next = isEnglish ? `${prefix}${translate(String(original).trim(), 'en')}${suffix}` : original;
                    if (node.nodeValue !== next) node.nodeValue = next;
                });
                document.querySelectorAll('[placeholder], [title], [aria-label]').forEach(element => {
                    ['placeholder', 'title', 'aria-label'].forEach(attribute => {
                        const current = element.getAttribute(attribute);
                        if (!current) return;
                        element.__soliOriginalAttributes ||= {};
                        const original = element.__soliOriginalAttributes[attribute] ?? current;
                        element.__soliOriginalAttributes[attribute] = original;
                        const next = isEnglish ? translate(original, 'en') : original;
                        if (current !== next) element.setAttribute(attribute, next);
                    });
                });
            };
            const scheduleApply = () => {
                if (animationFrame) return;
                animationFrame = requestAnimationFrame(() => { animationFrame = null; applyLanguage(currentLanguage); });
            };
            document.addEventListener('DOMContentLoaded', () => {
                try { currentLanguage = localStorage.getItem(SOLI_LANGUAGE_STORAGE_KEY) === 'en' ? 'en' : 'ar'; } catch (error) {}
                applyLanguage(currentLanguage);
                new MutationObserver(scheduleApply).observe(document.body, { childList: true, subtree: true });
            });
            return {
                getStoredLanguage: () => { try { return localStorage.getItem(SOLI_LANGUAGE_STORAGE_KEY) === 'en' ? 'en' : 'ar'; } catch (error) { return 'ar'; } },
                translate,
                applyLanguage,
                setLanguage: language => {
                    currentLanguage = language === 'en' ? 'en' : 'ar';
                    try { localStorage.setItem(SOLI_LANGUAGE_STORAGE_KEY, currentLanguage); } catch (error) {}
                    applyLanguage(currentLanguage);
                    window.dispatchEvent(new CustomEvent('soli:language-changed', { detail: { language: currentLanguage } }));
                }
            };
        })();
        window.SoliInterface = SoliInterface;

        // Browser instances receive only Firebase Web SDK configuration. Admin SDK remains server-only.
        let firebaseAuth = null;
        let firestoreDB = null;
        let firebaseStorage = null;
        if (isFirebaseConfigured) {
            try {
                const firebaseApp = firebase.apps?.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
                firebaseAuth = firebaseApp.auth();
                firestoreDB = firebaseApp.firestore();
                firebaseStorage = firebaseApp.storage();
            } catch (error) {
                console.warn('تعذر تهيئة Firebase في المتصفح:', error?.code || 'unknown');
            }
        }

        const initializeArabicDatePickers = (root = document, language = window.SoliInterface?.getStoredLanguage?.() || 'ar', force = false) => {
            if (!window.flatpickr) return;
            const dateInputs = root.querySelectorAll ? root.querySelectorAll('input.soli-date-input[type="date"], input.soli-date-input[type="month"]') : [];
            dateInputs.forEach(input => {
                const isEnglish = language === 'en';
                if (input._flatpickr && !force && input.dataset.soliDateLocale === language) return;
                const isMonthPicker = input.type === 'month';
                try {
                    if (input._flatpickr) input._flatpickr.destroy();
                    window.flatpickr(input, {
                        locale: isEnglish ? 'default' : window.flatpickr.l10ns?.ar,
                        disableMobile: true,
                        allowInput: false,
                        dateFormat: isMonthPicker ? 'Y-m' : 'Y-m-d',
                        altInput: !isEnglish,
                        altFormat: isMonthPicker ? 'F Y' : 'j F Y',
                        monthSelectorType: 'static',
                        onReady: (_selectedDates, _dateString, instance) => {
                            instance.calendarContainer.classList.toggle('soli-arabic-calendar', !isEnglish);
                            const visibleInput = instance.altInput || instance.input;
                            visibleInput.setAttribute('aria-label', input.getAttribute('aria-label') || (isEnglish ? 'Choose date' : 'اختيار التاريخ'));
                            visibleInput.setAttribute('dir', isEnglish ? 'ltr' : 'rtl');
                            visibleInput.setAttribute('lang', isEnglish ? 'en-GB' : 'ar-EG');
                        },
                        onChange: (_selectedDates, dateString, instance) => {
                            // يبقى x-model مرتبطاً بالحقل الأصلي بصيغة ISO، مع عرض عربي واضح في الحقل البديل.
                            instance.input.value = dateString;
                            instance.input.dispatchEvent(new Event('input', { bubbles: true }));
                            instance.input.dispatchEvent(new Event('change', { bubbles: true }));
                        }
                    });
                    input.dataset.soliDateLocale = language;
                } catch (error) {
                    console.warn('تعذر تهيئة منتقي التاريخ:', error);
                }
            });

        // أضاف Alpine حقولاً جديدة، حتى لا يعاملها المتصفح أو مدير كلمات المرور كحقول دخول.
        const initializeSearchFieldProtections = (root = document) => {
            const searchInputs = root.querySelectorAll
                ? root.querySelectorAll('input.soli-search-input, input[type="search"]')
                : [];
            searchInputs.forEach((input, index) => {
                input.type = 'search';
                input.setAttribute('autocomplete', 'off');
                input.setAttribute('autocapitalize', 'none');
                input.setAttribute('autocorrect', 'off');
                input.setAttribute('spellcheck', 'false');
                input.setAttribute('data-form-type', 'other');
                input.setAttribute('data-lpignore', 'true');
                input.setAttribute('data-1p-ignore', 'true');
                input.setAttribute('data-bwignore', 'true');
                input.setAttribute('data-protonpass-ignore', 'true');
                input.setAttribute('data-soli-search', 'true');
                if (!input.name) input.name = `soli-search-${index + 1}`;
                const form = input.closest('form');
                if (form) form.setAttribute('autocomplete', 'off');
            });
            const nonAuthFields = root.querySelectorAll
                ? root.querySelectorAll('input:not([type="password"]):not([data-soli-auth-field]), textarea:not([data-soli-auth-field]), select:not([data-soli-auth-field])')
                : [];
            nonAuthFields.forEach((field, index) => {
                if (field instanceof HTMLInputElement && ['hidden', 'checkbox', 'radio', 'file', 'submit', 'button'].includes(field.type)) return;
                field.setAttribute('autocomplete', 'off');
                field.setAttribute('autocapitalize', 'off');
                field.setAttribute('autocorrect', 'off');
                field.setAttribute('spellcheck', 'false');
                field.setAttribute('data-form-type', 'other');
                field.setAttribute('data-lpignore', 'true');
                field.setAttribute('data-1p-ignore', 'true');
                field.setAttribute('data-bwignore', 'true');
                field.setAttribute('data-protonpass-ignore', 'true');
                if (!field.getAttribute('name')) field.setAttribute('name', `soli-data-field-${index + 1}`);
                const form = field.closest('form');
                if (form && !form.matches('[data-soli-auth-form]')) form.setAttribute('autocomplete', 'off');
            });
        };

                            console.error('HYDRATION_APPLY_FAILED');

                                    this.recordSyncConflict(data, remoteMeta, 'وصل تعديل من جهاز آخر أثناء وجود تغييرات محلية لم تُرفع بعد؛ تم تسجيل تفاصيل التعارض.', localSnapshot);
                                }
                                if (operationalDocumentStore) this.startV2OperationalSync();
                                if (preservePendingLocalSnapshot) this.queueCloudSync();
                            }, 0);
                            }
                        },
                        (err) => {
                            console.error('خطأ في مزامنة Firestore:', err);
                            this.cloudStatus = 'offline';
                            this.scheduleCloudRetry();
                        }
                    );
                },

                scheduleCloudRetry() {
                    if (!this.cloudSyncEnabled || !this.cloudAuthReady || !this.localChangesPending) return;
                    clearTimeout(this.cloudRetryTimer);
                    this.cloudRetryAttempts = Math.min(Number(this.cloudRetryAttempts || 0) + 1, 5);
                    const delay = Math.min(30000, 1000 * (2 ** this.cloudRetryAttempts));

                async waitForCloudAuthReady(timeoutMs = 10000) {

                        await new Promise(resolve => setTimeout(resolve, 100));
                    }

                    return Boolean(this.cloudAuthReady && this.cloudMembershipReady);

                async persistUsersToCloudNow() {

                    const writeSequence = Number(this.syncChangeSequence || 0);
                    this.users = this.normalizeUsers(this.users);
                    this.syncCurrentUserFromUsers();
                    const usersWriteSequence = Number(this.usersChangeSequence || 0);
                    const localUsers = this.getCloudSafeUsers(this.users);
                    this.cloudStatus = 'syncing';
                    this.usersWriteInFlight = true;
                    try {
                        const result = await firestoreDB.runTransaction(async transaction => {
                            const snap = await transaction.get(docRef);
                            const remoteData = snap.exists ? snap.data() : {};
                            const remoteMeta = remoteData._syncMeta || {};
                            const revision = Number(remoteMeta.revision || 0) + 1;
                            transaction.set(docRef, {
                                users: localUsers,
                                _syncMeta: {
                                    ...remoteMeta,
                                    revision,
                                    writerId: this.syncDeviceId,
                                    writerName: this.currentUser?.fullName || 'مدير النظام',
                                    updatedAt: new Date().toISOString()
                                }
                            }, { merge: true });
                            return { revision };
                        });
                        this.syncRevision = result.revision;
                        this.localEditBaseRevision = result.revision;
                        const changedDuringWrite = Number(this.syncChangeSequence || 0) !== writeSequence;
                        this.localChangesPending = changedDuringWrite;
                        this.cloudStatus = 'online';
                        this.cloudRetryAttempts = 0;
                        this.usersLocalChangesPending = Number(this.usersChangeSequence || 0) !== usersWriteSequence;
                        if (this.localChangesPending) this.queueCloudSync();
                        return { ok: true, deferred: false };
                    } catch (error) {
                        console.error('تعذر حفظ قائمة الحسابات مباشرة في Firestore:', error);
                        this.cloudStatus = 'offline';
                        this.localChangesPending = true;
                        this.usersLocalChangesPending = true;
                        this.scheduleCloudRetry();
                        return { ok: false, deferred: false, error };
                    } finally {

                    }
                },

                // Debounced push so rapid local edits (typing, checkbox toggles) don't spam Firestore.
                queueCloudSync(delayMs = 600) {
                    if (!this.cloudSyncEnabled || !this.cloudAuthReady || !this.cloudServerHydrated || this.applyingRemoteUpdate || this.doctorInfoEditing || !firestoreDB) return;
                    clearTimeout(this.cloudSyncTimer);
                    this.cloudSyncTimer = setTimeout(() => {
                        if (this.isOperationalDocumentSyncActive()) this.pushStateToV2();

                },

                ensureDefaultMasterLists() {

                ensurePrescriptionPatientIds() {
                    // Fix legacy prescriptions that lack patientId by linking them to their patient via visit
                    const visitsMap = new Map();
                    (this.visits || []).forEach(visit => {
                        if (visit?.id) visitsMap.set(String(visit.id), String(visit.patientId || visit.patientLegacyId || ''));
                    });

                    (this.prescriptions || []).forEach(rx => {
                        if (rx && !rx.patientId && rx.visitId) {
                            const linkedPatientId = visitsMap.get(String(rx.visitId));
                            if (linkedPatientId) rx.patientId = linkedPatientId;
                        }
                    });
                },

                mergeCollectionArraysById(localArray, remoteArray) {
                    const local = Array.isArray(localArray) ? localArray : [];
                    const remote = Array.isArray(remoteArray) ? remoteArray : [];
                    const map = new Map();
                    this.deletedItemIds = this.deletedItemIds || new Set();

                    remote.forEach(item => {
                        if (!item) return;
                        const key = item.id != null ? String(item.id) : (item.patientId != null && item.createdAt ? String(item.patientId) + '_' + String(item.createdAt) : null);
                        if (key && !this.deletedItemIds.has(key)) {
                            map.set(key, item);
                        }
                    });

                    local.forEach(item => {
                        if (!item) return;
                        const key = item.id != null ? String(item.id) : (item.patientId != null && item.createdAt ? String(item.patientId) + '_' + String(item.createdAt) : null);
                        if (key && !this.deletedItemIds.has(key)) {
                            const existing = map.get(key);
                            map.set(key, existing ? { ...existing, ...item } : item);
                        }
                    });

                    return Array.from(map.values());
                },
                isDestructiveLegacySnapshot(remoteData, localData) {
                    if (this.cloudServerHydrated) return false;
                    const protectedKeys = ['patients', 'visits', 'appointments', 'invoices', 'prescriptions', 'expenses', 'waitingQueue'];
                    return protectedKeys.some(key => {
                        const remoteValue = remoteData?.[key];
                        const localValue = localData?.[key];
                        return Array.isArray(remoteValue) && remoteValue.length > 5 && (!Array.isArray(localValue) || localValue.length === 0);
                    });
                },
                isLegacySnapshotEquivalent(remoteData, localData) {
                    const stableValue = value => {
                        if (Array.isArray(value)) return value.map(stableValue);
                        if (value && typeof value === 'object') {
                            return Object.fromEntries(Object.keys(value).sort().map(key => [key, stableValue(value[key])]));
                        }
                        return value;
                    };
                    const comparableKeys = Object.keys(localData || {}).filter(key =>
                        key !== '_syncMeta' && (key !== 'doctorInfo' || this.doctorInfoDirty)
                    );
                    return comparableKeys.length > 0 && comparableKeys.every(key =>
                        JSON.stringify(stableValue(remoteData?.[key] ?? null)) === JSON.stringify(stableValue(localData?.[key] ?? null))
                    );
                },
                enterSyncSafetyHold(reason = '') {
                    this.syncSafetyHold = false;
                    this.syncSafetyHoldReason = '';
                    if (this.cloudStatus === 'blocked') this.cloudStatus = 'online';
                },
                pushStateToCloud() {
                    if (this.isOperationalDocumentSyncActive()) return this.pushStateToV2();
                    if (!this.cloudSyncEnabled || !this.cloudAuthReady || this.doctorInfoEditing || !firestoreDB || this.cloudWriteInFlight) return;
                    const dataToSave = this.getCloudSyncSnapshot();
                    const doctorInfoSignatureAtWrite = this.getDoctorInfoSignature();
                    const docRef = firestoreDB.doc(this.cloudDocPath);
                    const baseRevision = Number(this.localEditBaseRevision || this.syncRevision || 0);
                    const writeSequence = Number(this.syncChangeSequence || 0);
                    this.lastCloudWriteSequence = Math.max(Number(this.lastCloudWriteSequence || 0), writeSequence);
                    const writeMeta = {
                        revision: baseRevision + 1,
                        writerId: this.syncDeviceId,
                        writerName: this.currentUser?.fullName || 'المستخدم المحلي',
                        updatedAt: new Date().toISOString()
                    };
                    this.cloudStatus = 'syncing';
                    this.cloudWriteInFlight = true;
                    firestoreDB.runTransaction(async transaction => {
                        const snap = await transaction.get(docRef);
                        const remoteData = snap.exists ? snap.data() : {};
                        if (this.isDestructiveLegacySnapshot(remoteData, dataToSave)) {
                            return { blocked: true, reason: 'حُجبت كتابة لقطة ناقصة حتى لا يستبدل جهاز فارغ أو قديم سجلات العيادة المحفوظة.' };
                        }

                        const dataToWrite = { ...dataToSave };
                        const collectionKeys = ['patients', 'visits', 'appointments', 'invoices', 'prescriptions', 'expenses', 'waitingQueue'];
                        collectionKeys.forEach(key => {
                            if (!Array.isArray(dataToSave[key]) && Array.isArray(remoteData[key])) {
                                // استخدم البيانات من السحابة فقط إذا كانت البيانات المحلية فارغة
                                dataToWrite[key] = remoteData[key];
                            }
                        });

                        const remoteMeta = remoteData._syncMeta || {};
                        const remoteRevision = Number(remoteMeta.revision || 0);
                        const revision = Math.max(remoteRevision, baseRevision) + 1;
                        transaction.set(docRef, {
                            ...dataToWrite,
                            _syncMeta: { ...writeMeta, revision }
                        }, { merge: true });
                        return { revision, conflict: null };
                    }).then(result => {
                        if (result?.blocked) {
                            this.enterSyncSafetyHold(result.reason);
                            return;
                        }
                        this.syncSafetyHold = false;
                        this.syncSafetyHoldReason = '';
                        this.syncRevision = result.revision;
                        if (doctorInfoSignatureAtWrite && this.getDoctorInfoSignature() === doctorInfoSignatureAtWrite) this.doctorInfoDirty = false;
                        const changedDuringWrite = Number(this.syncChangeSequence || 0) !== writeSequence;
                        this.localChangesPending = changedDuringWrite;
                        this.localEditBaseRevision = result.revision;
                        this.syncJournal = {
                            ...this.normalizeSyncJournal(),
                            pendingState: this.localChangesPending,
                            pendingOperations: [],
                            baseRevision: result.revision,
                            lastAppliedRemoteRevision: Math.max(Number(this.syncJournal?.lastAppliedRemoteRevision || 0), result.revision)
                        };
                        this.persistState();
                        this.cloudStatus = 'online';
                        this.cloudRetryAttempts = 0;
                        this.queueV2MirroredChanges();
                        if (result.conflict) {
                            this.recordSyncConflict(result.conflict.data, result.conflict.meta, 'تم اكتشاف تعديل محفوظ من جهاز آخر قبل رفع التعديل المحلي؛ تم تسجيل تفاصيل التعارض.');
                        }
                    }).catch(err => {
                        console.error('تعذر رفع البيانات إلى Firestore (سيُعاد المحاولة تلقائياً عند عودة الاتصال):', err);
                        this.cloudStatus = 'offline';
                        this.syncJournal = { ...this.normalizeSyncJournal(), pendingState: true };
                        this.persistState();
                        this.scheduleCloudRetry();
                    }).finally(() => {
                        this.cloudWriteInFlight = false;
                        if (!this.syncSafetyHold && this.localChangesPending && navigator.onLine) this.queueCloudSync();
                    });
                },
                async pushStateToV2() {
                    if (!this.cloudSyncEnabled || !this.cloudAuthReady || !this.cloudServerHydrated || this.syncSafetyHold || this.doctorInfoEditing || !firestoreDB || this.cloudWriteInFlight) return;
                    const writeSequence = Number(this.syncChangeSequence || 0);
                    const doctorInfoSignatureAtWrite = this.getDoctorInfoSignature();
                    this.cloudStatus = 'syncing';
                    this.cloudWriteInFlight = true;
                    try {
                        const result = await this.flushV2MirroredChanges({ operationalWrite: true });
                        if (!result?.ok) {
                            const syncError = result?.error || new Error('تعذرت مزامنة وثائق V3.');
                            syncError.deferred = Boolean(result?.deferred);
                            throw syncError;
                        }
                        if (doctorInfoSignatureAtWrite && this.getDoctorInfoSignature() === doctorInfoSignatureAtWrite) this.doctorInfoDirty = false;
                        this.localChangesPending = Number(this.syncChangeSequence || 0) !== writeSequence;
                        this.syncJournal = {
                            ...this.normalizeSyncJournal(),
                            pendingState: this.localChangesPending,
                            pendingOperations: [],
                            baseRevision: Number(this.syncRevision || this.syncJournal?.baseRevision || 0)
                        };
                        this.persistState();
                        this.cloudStatus = 'online';
                        this.cloudRetryAttempts = 0;
                    } catch (error) {
                        const authenticatedCloudSessionReady = Boolean(
                            navigator.onLine && this.cloudAuthReady && this.cloudMembershipReady
                        );
                        const schemaLabel = this.isTopLevelOperationalSyncActive() ? 'V3' : 'V2';
                        if (error?.deferred) {
                            console.info(`تم تأجيل مزامنة مجموعات Firestore ${schemaLabel} لأن دفعة أخرى أو التحقق من الهوية ما زال جارياً؛ ستستأنف تلقائياً.`, error);
                        } else {
                            console.error(`تعذر رفع البيانات إلى Firestore ${schemaLabel} (سيُعاد المحاولة تلقائياً):`, error);
                        }
                        // A failed or deferred data batch must not downgrade a verified Firebase
                        // identity and active clinic membership to a false local/offline state.
                        // The change remains local-first and is retried in the background.
                        this.cloudStatus = authenticatedCloudSessionReady ? 'online' : 'offline';
                        this.localChangesPending = true;
                        this.syncJournal = { ...this.normalizeSyncJournal(), pendingState: true };
                        this.persistState();
                        this.scheduleCloudRetry();
                    } finally {
                        this.cloudWriteInFlight = false;
                        if (this.localChangesPending && navigator.onLine) this.queueCloudSync();
                        this.resumeV2RemoteStateHydration();
                    }
                },

                // ---- FIRESTORE V2: CONTROLLED MULTI-DOCUMENT MIGRATION ----
                // The legacy shared document remains the active read/write source while V2 is
                // created and reconciled. These functions never delete the legacy document.
                getV2ClinicRef() {
                    if (!firestoreDB) throw new Error('Firestore غير متاح حالياً.');
                    return firestoreDB.collection('clinics').doc(String(this.cloudClinicId));
                },
                getV2Collection(name) {

                },
                getTopLevelCollection(name) {
                    if (!firestoreDB) throw new Error('Firestore غير متاح حالياً.');

                },
                getTopLevelDocumentId(name, sourceDocumentId) {

                    return this.safeFirestoreId(`${this.cloudClinicId}__${sourceId}`, `${name}-${sourceId}`);
                },
                getTopLevelMigrationState(migration = this.dataMigration) {

                },
                isTopLevelOperationalSyncActive(migration = this.dataMigration) {

                },
                isOperationalDocumentSyncActive(migration = this.dataMigration) {

                },
                getAccessibleVisitDepartments() {
                    if (this.isCurrentUserManager?.()) return null;
                    const permissions = this.currentUser?.permissions || {};
                    if (permissions.visits === true) return null;
                    const departments = [];
                    if (permissions.newVisit === true || permissions.clinicVisits === true) departments.push('clinic');
                    if (permissions.dentalVisits === true) departments.push('dental');
                    if (permissions.operationsVisits === true) departments.push('operations');
                    if (permissions.labsVisits === true) departments.push('laboratory');
                    if (permissions.radiologyVisits === true) departments.push('radiology');
                    return [...new Set(departments)];
                },
                getOperationalCollectionQuery(name) {
                    const query = this.isTopLevelOperationalSyncActive()
                        ? this.getTopLevelCollection(name).where('clinicId', '==', String(this.cloudClinicId))
                        : this.getV2Collection(name);
                    if (String(name) !== 'visits') return query;
                    const departments = this.getAccessibleVisitDepartments();
                    return departments === null || departments.length === 0
                        ? query
                        : query.where('department', 'in', departments);
                },
                sanitizeForFirestore(value) {

                            if (entry !== undefined) result[key] = this.sanitizeForFirestore(entry);

                        }, {});

                },
                getMigrationCounts(state = this.getSyncDataSnapshot()) {
                    const patients = Array.isArray(state?.patients) ? state.patients : [];
                    return {
                        patients: patients.length,
                        visits: patients.reduce((total, patient) => total + (Array.isArray(patient?.records) ? patient.records.length : 0), 0),
                        appointments: Array.isArray(state?.appointments) ? state.appointments.length : 0,
                        invoices: Array.isArray(state?.invoices) ? state.invoices.length : 0,
                        prescriptions: Array.isArray(state?.prescriptions) ? state.prescriptions.length : 0,
                        expenses: Array.isArray(state?.expenses) ? state.expenses.length : 0,

                buildV2MigrationOperations(state, migrationId, migratedAt = this.dataMigration?.lastCompletedAt || new Date().toISOString()) {
                    const operations = [];
                    const clinicRef = this.getV2ClinicRef();
                    const actorUid = String(firebaseAuth?.currentUser?.uid || '');
                    const withOperationalMetadata = (data, collection, recordId) => ({
                        ...data,
                        clinicId: String(this.cloudClinicId),
                        operationId: String(data?.operationId || `migration:${migrationId}:${collection}:${recordId}`),
                        createdAt: String(data?.createdAt || migratedAt),
                        updatedAt: String(data?.updatedAt || migratedAt),
                        createdBy: String(data?.createdBy || actorUid),
                        updatedBy: String(data?.updatedBy || actorUid),

                            ...withOperationalMetadata(data, collection, id),

                            migratedAt,
                            updatedAt: data?.updatedAt || migratedAt

                        operations.push({
                            ref: clinicRef.collection(collection).doc(this.safeFirestoreId(id, `${collection}-${operations.length}`)),
                            data: payload
                        });
                    };

                    (state.patients || []).forEach((patient, patientIndex) => {
                        const { records = [], ...profile } = patient || {};
                        const patientId = this.safeFirestoreId(patient?.id, `patient-${patientIndex}`);
                        add('patients', patientId, {
                            ...profile,
                            patientId,
                            legacyId: String(patient?.id || patientId),
                            searchName: String(patient?.fullName || '').trim().toLowerCase()
                        });
                        (Array.isArray(records) ? records : []).forEach((visit, visitIndex) => {
                            const visitId = this.safeFirestoreId(visit?.id, `${patientId}-visit-${visitIndex}`);
                            add('visits', visitId, {
                                ...visit,
                                legacyId: String(visit?.id || visitId),
                                patientId,
                                patientLegacyId: String(patient?.id || patientId),
                                department: String(visit?.department || 'clinic'),
                                visitDate: String(visit?.visitDate || visit?.date || migratedAt.slice(0, 10))
                            });
                        });
                    });

                    [
                        ['appointments', state.appointments],
                        ['invoices', state.invoices],
                        ['prescriptions', state.prescriptions],
                        ['expenses', state.expenses],
                        ['waitingQueue', state.waitingQueue]
                    ].forEach(([collection, items]) => (items || []).forEach((item, index) => {
                        const id = this.safeFirestoreId(item?.id, `${collection}-${index}`);
                        add(collection, id, { ...item, legacyId: String(item?.id || id) });
                    }));

                    add('settings', 'general', {

                        clinics: state.clinics || [],
                        visitTypePrices: state.visitTypePrices || {},
                        idleLockEnabled: Boolean(state.idleLockEnabled),
                        idleLockMinutes: Number(state.idleLockMinutes || 15),
                        branding: { logoUrl: this.clinicLogoUrl || '', logoStoragePath: this.clinicLogoStoragePath || '' }
                    });
                    add('catalogs', 'clinical', {
                        symptomsList: state.symptomsList || [],
                        chronicDiseasesList: state.chronicDiseasesList || [],
                        diagnosesMasterList: state.diagnosesMasterList || [],
                        medicinesMasterList: state.medicinesMasterList || [],
                        labTestsMasterList: state.labTestsMasterList || [],
                        radiologyMasterList: state.radiologyMasterList || [],
                        vitalSignsMasterList: state.vitalSignsMasterList || [],
                        expenseCategories: state.expenseCategories || [],
                        recordFormSections: state.recordFormSections || []
                    });
                    add('catalogs', 'templates', {

                    this.v2MirrorTimer = setTimeout(() => this.flushV2MirroredChanges(), 900);
                },
                async flushV2MirroredChanges({ operationalWrite = false } = {}) {
                    if (this.v2MirrorInFlight || this.dataMigration?.status !== 'completed' || !navigator.onLine || !(await this.waitForCloudAuthReady())) return { ok: false, deferred: true };
                    this.v2MirrorInFlight = true;
                    try {
                        const state = this.getSyncDataSnapshot();
                        const topLevel = this.getTopLevelMigrationState();
                        const operations = this.isTopLevelOperationalSyncActive()
                            ? this.buildTopLevelMigrationOperations(state, topLevel.migrationId, topLevel.lastCompletedAt)
                            : this.buildV2MigrationOperations(state, this.dataMigration.migrationId, this.dataMigration.lastCompletedAt);
                        const journal = this.normalizeSyncJournal();
                        const pendingDeletes = (journal.pendingOperations || []).map(operation => ({
                            ...operation,
                            ref: this.getOperationalDocumentRef(operation.collection, operation.documentId),
                            data: this.getOperationalDeletePayload(operation)
                        }));
                        const pendingDeletePaths = new Set(pendingDeletes.map(operation => operation.ref.path));
                        const changed = operations.filter(operation => {
                            const key = operation.ref.path;
                            const fingerprint = this.getV2MirrorFingerprint(operation.data);
                            operation.fingerprint = fingerprint;
                            return pendingDeletePaths.has(key) || this.v2MirrorFingerprints[key] !== fingerprint;
                        });
                        const upsertPaths = new Set(changed.map(operation => operation.ref.path));
                        // If a record was intentionally restored before the queued delete was
                        // committed, the current upsert wins and cancels that stale delete.
                        const deletes = pendingDeletes.filter(operation => !upsertPaths.has(operation.ref.path));
                        const cancelledDeletes = pendingDeletes.filter(operation => upsertPaths.has(operation.ref.path));
                        const completedDeleteIds = new Set([...deletes, ...cancelledDeletes].map(operation => operation.operationId));
                        const batches = [...changed, ...deletes];
                        for (let offset = 0; offset < batches.length; offset += 400) {
                            const batch = firestoreDB.batch();
                            batches.slice(offset, offset + 400).forEach(operation => {
                                // Tombstones intentionally use set/update rather than delete.
                                // Firestore rules keep physical deletion disabled.
                                batch.set(operation.ref, operation.data, { merge: true });
                            });
                            await batch.commit();
                        }
                        changed.forEach(operation => {
                            this.v2MirrorFingerprints[operation.ref.path] = operation.fingerprint;
                            this.applyLocalOperationalUpsertToCache(operation);
                        });
                        deletes.forEach(operation => {
                            this.v2MirrorFingerprints[operation.ref.path] = this.getV2MirrorFingerprint(operation.data);
                            this.applyLocalOperationalDeleteToCache(operation);
                        });
                        const currentOperationPaths = new Set(operations.map(operation => operation.ref.path));
                        const latestJournal = this.normalizeSyncJournal();
                        const committedDeleteSequences = new Map(
                            pendingDeletes.map(operation => [operation.operationId, Number(operation.sequence || 0)])
                        );
                        const pendingOperations = latestJournal.pendingOperations.filter(operation => {
                            const committedSequence = committedDeleteSequences.get(operation.operationId);
                            return committedSequence === undefined || Number(operation.sequence || 0) > committedSequence;
                        });
                        const completedTombstones = [
                            ...(latestJournal.completedTombstones || []).filter(operation => {
                                const ref = this.getOperationalDocumentRef(operation.collection, operation.documentId);
                                return !currentOperationPaths.has(ref.path) && !deletes.some(item => item.operationId === operation.operationId);
                            }),
                            ...deletes.map(operation => ({
                                operationId: operation.operationId,
                                kind: 'tombstone',
                                collection: operation.collection,
                                documentId: operation.documentId,
                                patientId: operation.patientId || '',
                                sequence: Number(operation.sequence || 0),
                                deletedAt: operation.deletedAt || new Date().toISOString(),
                                writerId: operation.writerId || this.syncDeviceId || ''
                            }))
                        ].slice(-500);
                        this.syncJournal = {
                            ...latestJournal,
                            pendingOperations,
                            completedTombstones,
                            pendingState: pendingOperations.length > 0 || Boolean(this.localChangesPending),
                            nextSequence: Math.max(Number(latestJournal.nextSequence || 0), Number(this.syncChangeSequence || 0))
                        };
                        this.saveV2MirrorFingerprints();
                        const wasApplyingRemoteUpdate = this.applyingRemoteUpdate;
                        this.applyingRemoteUpdate = true;
                        const statusKey = this.isTopLevelOperationalSyncActive() ? 'topLevelCollections' : null;
                        const syncState = { dualWriteStatus: batches.length ? 'synced' : 'up_to_date', lastDualWriteAt: new Date().toISOString(), lastError: '' };
                        this.dataMigration = statusKey
                            ? { ...this.dataMigration, [statusKey]: { ...this.getTopLevelMigrationState(), ...syncState } }
                            : { ...this.dataMigration, ...syncState };
                        this.persistState();
                        this.$nextTick(() => { this.applyingRemoteUpdate = wasApplyingRemoteUpdate; });
                        return { ok: true, changed: batches.length, deleted: deletes.length };
                    } catch (error) {
                        console.error('تعذرت الكتابة المزدوجة إلى Firestore V2:', error);
                        const wasApplyingRemoteUpdate = this.applyingRemoteUpdate;
                        this.applyingRemoteUpdate = true;
                        const statusKey = this.isTopLevelOperationalSyncActive() ? 'topLevelCollections' : null;
                        const syncState = { dualWriteStatus: 'pending_retry', lastError: `تعذرت مزامنة وثائق البيانات: ${String(error?.message || error)}` };
                        this.dataMigration = statusKey
                            ? { ...this.dataMigration, [statusKey]: { ...this.getTopLevelMigrationState(), ...syncState } }
                            : { ...this.dataMigration, ...syncState };
                        this.persistState();
                        this.$nextTick(() => { this.applyingRemoteUpdate = wasApplyingRemoteUpdate; });
                        if (!operationalWrite) setTimeout(() => this.queueV2MirroredChanges(), 4000);
                        return { ok: false, error };
                    } finally {
                        this.v2MirrorInFlight = false;
                        this.resumeV2RemoteStateHydration();
                    }
                },
                async verifyV2MigrationConsistency() {
                    if (!['owner', 'admin'].includes(String(this.currentUser?.role || '').toLowerCase())) { alert('التحقق من المطابقة متاح لمدير النظام فقط.'); return; }
                    if (!navigator.onLine || !(await this.waitForCloudAuthReady())) { alert('يلزم اتصال Firebase للتحقق من المطابقة. لم تتغير أي بيانات.'); return; }
                    const state = this.getSyncDataSnapshot();
                    const expected = {
                        ...this.getMigrationCounts(state),
                        auditLogs: (state.auditLog || []).length,
                        archiveManifests: (state.archiveManifests || []).length
                    };
                    const collectionNames = ['patients', 'visits', 'appointments', 'invoices', 'prescriptions', 'expenses', 'waitingQueue', 'auditLogs', 'archiveManifests'];
                    try {
                        const snapshots = await Promise.all(collectionNames.map(name => this.getV2Collection(name).get()));
                        const actual = snapshots.reduce((result, snapshot, index) => ({ ...result, [collectionNames[index]]: snapshot.size }), {});
                        const compare = { patients: expected.patients, visits: expected.visits, appointments: expected.appointments, invoices: expected.invoices, prescriptions: expected.prescriptions, expenses: expected.expenses, waitingQueue: expected.waitingQueue, auditLogs: expected.auditLogs, archiveManifests: expected.archiveManifests };
                        const mismatches = Object.keys(compare).filter(key => Number(actual[key] || 0) < Number(compare[key] || 0));
                        const validation = { checkedAt: new Date().toISOString(), expected: compare, actual, matches: mismatches.length === 0, mismatches };
                        this.dataMigration = { ...this.dataMigration, validation, status: validation.matches ? 'completed' : 'needs_review', lastError: validation.matches ? '' : `تحتاج ${mismatches.join('، ')} إلى مراجعة قبل تحويل القراءة.` };
                        this.persistState();
                        if (validation.matches) alert('اكتملت مطابقة V2: لا توجد وثائق ناقصة مقارنة بالمصدر القديم. تظل القراءة القديمة هي النشطة إلى أن تعتمد التحويل لاحقاً.');
                        else alert(`اكتملت المطابقة مع ملاحظات: ${mismatches.join('، ')}. لم تُحذف البيانات ولم تتحول القراءة.`);
                    } catch (error) {
                        console.error('تعذر التحقق من مطابقة Firestore V2:', error);
                        this.dataMigration = { ...this.dataMigration, status: 'needs_review', lastError: `تعذر فحص المطابقة: ${String(error?.message || error)}` };
                        this.persistState();
                    }
                },
                async approveV2Cutover() {
                    if (!['owner', 'admin'].includes(String(this.currentUser?.role || '').toLowerCase())) { alert('اعتماد التحويل متاح لمدير النظام فقط.'); return; }
                    const validation = this.dataMigration?.validation;
                    if (this.dataMigration?.status !== 'completed' || !validation?.matches) { alert('يجب إكمال الترحيل ونجاح مطابقة الأعداد قبل إيقاف اللقطة القديمة.'); return; }
                    if (!confirm('سيوقف التطبيق القراءة والكتابة من soliMedicalApp/sharedClinicData ويستخدم المجموعات المستقلة فقط. سيبقى المصدر القديم محفوظًا دون حذف. هل تعتمد التحويل؟')) return;
                    const cutoverAt = new Date().toISOString();
                    try {
                        await this.getV2Collection('migrationManifests').doc(this.dataMigration.migrationId).set({ status: 'cutover-approved', legacyReadDisabledAt: cutoverAt, legacyDocumentRetained: true, cutoverApprovedBy: String(firebaseAuth?.currentUser?.uid || '') }, { merge: true });
                        this.dataMigration = { ...this.dataMigration, legacyCutoverApproved: true, legacyReadDisabledAt: cutoverAt, dualWriteStatus: 'v2_only' };

                        alert('تم اعتماد التحويل. تستخدم المزامنة الآن المجموعات المستقلة فقط، ولم تُحذف اللقطة القديمة.');
                    } catch (error) { this.dataMigration = { ...this.dataMigration, lastError: `تعذر اعتماد التحويل: ${String(error?.message || error)}` }; this.persistState(); }
                },
                prepareV2MigrationPreview() {
                    if (!['owner', 'admin'].includes(String(this.currentUser?.role || '').toLowerCase())) { alert('معاينة الترحيل متاحة لمدير النظام فقط.'); return; }
                    const migrationId = this.dataMigration?.migrationId || `v2-${Date.now()}`;
                    const counts = this.getMigrationCounts();
                    this.dataMigration = {
                        ...this.dataMigration,
                        schemaVersion: 2,
                        status: 'preview_ready',
                        migrationId,
                        counts,
                        lastPreviewAt: new Date().toISOString(),
                        lastError: ''
                    };
                    this.persistState();
                    this.queueCloudSync();
                    alert(`معاينة آمنة جاهزة: ${counts.patients} مريض و${counts.visits} زيارة و${counts.appointments} موعد. لم تُكتب أو تُحذف أي بيانات.`);
                },
                async runV2Migration() {
                    if (!['owner', 'admin'].includes(String(this.currentUser?.role || '').toLowerCase())) { alert('الترحيل متاح لمدير النظام فقط.'); return; }
                    if (!navigator.onLine || !(await this.waitForCloudAuthReady())) {
                        alert('يلزم اتصال إنترنت ومزامنة Firebase نشطة قبل الترحيل. لا يزال بإمكانك حفظ نسخة احتياطية محلية الآن.');
                        return;
                    }
                    const migrationId = this.dataMigration?.migrationId || `v2-${Date.now()}`;
                    const state = this.getSyncDataSnapshot();
                    const counts = this.getMigrationCounts(state);
                    if (!confirm(`سيُنشأ نسخة V2 مستقلة قابلة لإعادة التشغيل لـ ${counts.patients} مريض و${counts.visits} زيارة. لن يحذف التطبيق الوثيقة القديمة. هل تريد المتابعة؟`)) return;

                    const completedAt = new Date().toISOString();
                    const operations = this.buildV2MigrationOperations(state, migrationId, completedAt);
                    const manifestRef = this.getV2Collection('migrationManifests').doc(migrationId);
                    this.dataMigration = { ...this.dataMigration, schemaVersion: 2, status: 'running', migrationId, counts, lastError: '' };
                    this.persistState();
                    try {
                        await manifestRef.set(this.sanitizeForFirestore({
                            migrationId,
                            status: 'running',
                            source: this.cloudDocPath,
                            counts,
                            migrationChecksum: this.getV2MirrorFingerprint(operations.map(operation => operation.data.payloadChecksum)),
                            startedAt: new Date().toISOString(),
                            legacyDocumentRetained: true
                        }), { merge: true });
                        for (let offset = 0; offset < operations.length; offset += 400) {
                            const batch = firestoreDB.batch();
                            operations.slice(offset, offset + 400).forEach(operation => batch.set(operation.ref, operation.data, { merge: true }));
                            await batch.commit();
                        }
                        await manifestRef.set({
                            status: 'completed',
                            completedAt,
                            operationCount: operations.length,
                            migrationChecksum: this.getV2MirrorFingerprint(operations.map(operation => operation.data.payloadChecksum)),
                            legacyDocumentRetained: true
                        }, { merge: true });
                        this.dataMigration = { ...this.dataMigration, status: 'completed', migrationId, counts, lastCompletedAt: completedAt, dualWriteStatus: 'ready', validation: null, lastError: '' };
                        this.v2MirrorFingerprints = {};
                        this.saveV2MirrorFingerprints();
                        this.recordAudit('ترحيل Firestore V2', `اكتملت كتابة ${operations.length} وثيقة في المخطط الجديد دون حذف المصدر القديم.`);
                        alert('اكتمل إنشاء نسخة V2. يستمر التطبيق بالقراءة من المخطط القديم لحين مراجعة تقرير المطابقة واعتماد تحويل القراءة.');
                    } catch (error) {
                        console.error('تعذر إكمال ترحيل Firestore V2:', error);
                        this.dataMigration = { ...this.dataMigration, status: 'needs_review', migrationId, counts, lastError: String(error?.message || error) };
                        alert('توقف الترحيل قبل الاكتمال. لم تُحذف البيانات القديمة؛ عالج الاتصال ثم أعد تشغيله بالمعرّف نفسه دون تكرار السجلات.');
                    } finally {
                        this.persistState();
                        this.queueCloudSync();
                    }
                },
                get dataMigrationStatusLabel() {
                    return ({
                        not_started: 'لم يبدأ',
                        preview_ready: 'المعاينة جاهزة',
                        running: 'جارٍ إنشاء النسخة',
                        completed: 'اكتملت النسخة للمراجعة',
                        needs_review: 'يحتاج مراجعة'
                    })[this.dataMigration?.status] || 'لم يبدأ';
                },

                // ---- CLINIC LOGO: FIREBASE STORAGE, NOT FIRESTORE BASE64 ----
                getClinicLogoSrc() {
                    return this.clinicLogoUrl || this.pendingClinicLogoDataUrl || this.clinicLogoDataUrl || '';
                },
                async uploadClinicLogoDataUrl(dataUrl, { silent = false } = {}) {
                    if (!dataUrl || !String(dataUrl).startsWith('data:image/')) return false;
                    if (!firebaseStorage || !firestoreDB || !navigator.onLine || !(await this.waitForCloudAuthReady())) {
                        this.pendingClinicLogoDataUrl = dataUrl;
                        this.persistState();
                        if (!silent) alert('حُفظت معاينة الشعار محلياً بانتظار اتصال Firebase؛ لن يُرسل الشعار كنص Base64 إلى Firestore.');
                        return false;
                    }
                    this.logoUploadInProgress = true;
                    const previousPath = this.clinicLogoStoragePath;
                    try {
                        const objectRef = firebaseStorage.ref().child(`clinics/${this.cloudClinicId}/branding/logo-${Date.now()}.webp`);
                        const snapshot = await objectRef.putString(dataUrl, 'data_url', {
                            contentType: 'image/webp',
                            cacheControl: 'private,max-age=86400'
                        });
                        const logoUrl = await snapshot.ref.getDownloadURL();
                        const branding = {
                            logoUrl,
                            logoStoragePath: snapshot.ref.fullPath,
                            logoUpdatedAt: new Date().toISOString(),
                            previousLogoStoragePath: previousPath || ''
                        };
                        await this.getV2Collection('settings').doc('general').set({
                            branding,
                            schemaVersion: 2,
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                        await firestoreDB.doc(this.cloudDocPath).set({
                            clinicLogoUrl: logoUrl,
                            clinicLogoStoragePath: snapshot.ref.fullPath,
                            clinicLogoDataUrl: firebase.firestore.FieldValue.delete(),
                            _logoStorageMigration: { migratedAt: new Date().toISOString(), storagePath: snapshot.ref.fullPath }
                        }, { merge: true });
                        this.clinicLogoUrl = logoUrl;
                        this.clinicLogoStoragePath = snapshot.ref.fullPath;
                        this.pendingClinicLogoDataUrl = '';
                        this.clinicLogoDataUrl = '';
                        this.persistState();
                        this.recordAudit('تخزين شعار العيادة', 'تم حفظ رابط الشعار في Firebase Storage دون حفظ Base64 داخل Firestore.');
                        if (!silent) alert('تم رفع الشعار إلى Firebase Storage وحفظ رابطه بأمان. احتُفظ بملف الشعار السابق في Storage للاسترجاع ولا يُحذف تلقائياً.');
                        return true;
                    } catch (error) {
                        console.error('تعذر رفع شعار العيادة إلى Firebase Storage:', error);
                        this.pendingClinicLogoDataUrl = dataUrl;
                        this.persistState();
                        if (!silent) alert('تعذر رفع الشعار إلى Firebase Storage الآن. بقيت المعاينة محفوظة محلياً، ولن تُحذف البيانات الحالية.');
                        return false;
                    } finally {
                        this.logoUploadInProgress = false;
                        this.renderIcons();
                    }
                },
                async migrateLegacyClinicLogoToStorage() {
                    if (this.currentUser?.role !== 'admin') { alert('ترحيل الشعار متاح لمدير النظام فقط.'); return; }
                    if (!this.clinicLogoDataUrl?.startsWith('data:image/')) { alert('لا يوجد شعار Base64 قديم يحتاج إلى ترحيل.'); return; }
                    if (!confirm('سيُرفع الشعار الحالي إلى Firebase Storage ويُحذف نص Base64 من وثيقة Firestore فقط بعد نجاح الحفظ. هل تريد المتابعة؟')) return;
                    await this.uploadClinicLogoDataUrl(this.clinicLogoDataUrl);
                },

                // ---- CLINIC EXPENSES ("المنصرف") ----
                addExpense() {
                    if (!this.newExpenseForm.category || !this.newExpenseForm.amount) {
                        alert('يرجى اختيار بند المصروف وإدخال المبلغ');
                        return;
                    }
                    this.expenses.unshift({
                        id: Date.now(),
                        category: this.newExpenseForm.category,
                        amount: Number(this.newExpenseForm.amount),
                        date: this.newExpenseForm.date || new Date().toISOString().slice(0, 10),
                        notes: this.newExpenseForm.notes || ''
                    });
                    this.newExpenseForm = { category: '', amount: '', date: new Date().toISOString().slice(0, 10), notes: '' };
                },
                removeExpense(id) {
                    if (!confirm('هل تريد حذف هذا المصروف؟')) return;
                    this.expenses = this.expenses.filter(e => e.id !== id);
                },
                addExpenseCategory() {
                    const val = this.newExpenseCategoryInput.trim();
                    if (!val) return;
                    if (this.expenseCategories.includes(val)) {
                        alert('هذا البند موجود بالفعل');
                        return;
                    }
                    this.expenseCategories.push(val);
                    this.newExpenseCategoryInput = '';
                    this.renderIcons();
                },
                removeExpenseCategory(index) {
                    this.expenseCategories.splice(index, 1);
                },

                // Shared daily/weekly/monthly period filter used by both income and expenses.
                isDateInPeriod(dateStr, period) {
                    if (period === 'all' || !dateStr) return true;
                    const d = new Date(dateStr); d.setHours(0, 0, 0, 0);
                    const today = new Date(); today.setHours(0, 0, 0, 0);
                    if (period === 'daily') return d.getTime() === today.getTime();
                    if (period === 'weekly') {
                        const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate() - 7);
                        return d >= weekAgo && d <= today;
                    }
                    if (period === 'monthly') {
                        const monthAgo = new Date(today); monthAgo.setMonth(monthAgo.getMonth() - 1);
                        return d >= monthAgo && d <= today;
                    }
                    return true;
                },

                invoiceNetTotal(invoice) {
                    const amount = Number(invoice?.amount ?? invoice?.total ?? 0);
                    const discount = Number(invoice?.discount ?? 0);
                    return Math.max(0, amount - discount);
                },

                get prescriptionGroups() {
                    const groups = {};
                    (this.prescriptions || []).forEach(rx => {
                        const key = String(rx.patientId || rx.patientName || rx.id);
                        if (!groups[key]) {
                            groups[key] = {
                                key,
                                patientId: rx.patientId || null,
                                patientName: rx.patientName || 'مريض غير محدد',
                                patientPhone: rx.patientPhone || '',
                                records: []
                            };
                        }
                        groups[key].records.push(rx);
                        if (!groups[key].patientPhone && rx.patientPhone) groups[key].patientPhone = rx.patientPhone;
                    });
                    const query = this.normalizeSearchText(this.pharmacySearch || '');
                    return Object.values(groups)
                        .filter(group => group.records.some(rx => {
                            const searchable = [group.patientName, group.patientPhone, rx.diagnosisText, rx.diagnosis, ...(rx.medicinesWithDosage || []).map(medicine => medicine?.name || '')].join(' ');
                            return this.matchesArchiveDate(rx.date, this.pharmacyYearFilter, this.pharmacyMonthFilter, this.pharmacyDayFilter)
                                && (!query || this.normalizeSearchText(searchable).includes(query));
                        }))
                        .map(group => ({
                            ...group,
                            records: [...group.records].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))
                        }))
                        .sort((a, b) => String(b.records[0]?.date || '').localeCompare(String(a.records[0]?.date || '')));
                },

                get filteredInvoicesByPeriod() {
                    return this.invoices.filter(inv => this.isDateInPeriod(inv.date, this.incomePeriodFilter));
                },
                get totalIncomeForPeriod() {
                    return this.filteredInvoicesByPeriod.reduce((sum, inv) => sum + this.invoiceNetTotal(inv), 0);
                },
                get filteredExpensesByPeriod() {
                    return this.expenses.filter(e => this.isDateInPeriod(e.date, this.expensePeriodFilter));
                },
                get totalExpenseForPeriod() {
                    return this.filteredExpensesByPeriod.reduce((sum, e) => sum + Number(e.amount || 0), 0);
                },

                // ---- COMPREHENSIVE REPORTS (day / week / month / year across the whole system) ----
                get reportsYearOptions() {
                    const currentYear = new Date().getFullYear();
                    const years = [];
                    for (let y = currentYear; y >= currentYear - 5; y--) years.push(y.toString());
                    return years;
                },
                isDateInReportPeriod(dateStr) {
                    if (!dateStr) return false;
                    const today = new Date(); today.setHours(0, 0, 0, 0);
                    if (this.reportsPeriodType === 'daily') {
                        const d = new Date(dateStr); d.setHours(0, 0, 0, 0);
                        return d.getTime() === today.getTime();
                    }
                    if (this.reportsPeriodType === 'weekly') {
                        const d = new Date(dateStr); d.setHours(0, 0, 0, 0);
                        const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate() - 7);
                        return d >= weekAgo && d <= today;
                    }
                    if (this.reportsPeriodType === 'monthly') {
                        const ym = this.reportsSelectedMonth || today.toISOString().slice(0, 7);
                        return dateStr.slice(0, 7) === ym;
                    }
                    if (this.reportsPeriodType === 'yearly') {
                        const y = this.reportsSelectedYear || today.getFullYear().toString();
                        return dateStr.slice(0, 4) === y.toString();
                    }
                    return true;
                },
                get reportInvoices() {
                    return this.invoices.filter(inv => this.isDateInReportPeriod(inv.date));
                },
                get reportIncome() {
                    return this.reportInvoices.reduce((sum, inv) => sum + this.invoiceNetTotal(inv), 0);
                },
                get reportExpenses() {
                    return this.expenses.filter(e => this.isDateInReportPeriod(e.date));
                },
                get reportExpenseTotal() {
                    return this.reportExpenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
                },
                get reportPatientRecords() {
                    const items = [];
                    this.patients.forEach(p => {
                        (p.records || []).forEach(rec => {
                            if (this.isDateInReportPeriod(rec.date)) items.push({ ...rec, patientName: p.fullName });
                        });
                    });
                    return items;
                },
                get reportPrescriptions() {
                    return this.prescriptions.filter(rx => this.isDateInReportPeriod(rx.date));
                },

                // ---- LOGIN SESSION PERSISTENCE ----
                // Keeps the doctor/staff logged in across page reloads or when switching between
                // desktop/mobile view on the same browser, instead of being signed out unexpectedly.
                sessionKey: 'soliMedicalSession_v1',

                restoreSession() {
                    // A local session marker is not an authentication credential. Firebase's
                    // onAuthStateChanged callback is the only authority allowed to restore UI access.
                    try {
                        const raw = localStorage.getItem(this.sessionKey);
                        if (!raw || !this.isPermanentFirebaseUser()) {
                            this.clearSession();
                            return;
                        }
                        const session = JSON.parse(raw);
                        const firebaseUid = String(firebaseAuth.currentUser?.uid || '');
                        const user = this.users.find(candidate =>
                            String(candidate.id ?? '') === String(session.userId ?? '') &&
                            (!session.firebaseUid || String(session.firebaseUid) === firebaseUid) &&
                            (!candidate.firebaseUid || String(candidate.firebaseUid) === firebaseUid)
                        );
                        if (!user || user.active === false) {
                            this.clearSession();
                            return;
                        }
                        this.currentUser = this.withCompatiblePermissions(user);
                        this.isAuthenticated = true;
                        this.restoreLastAllowedView(user);
                        this.restoreIdleLockState();
                    } catch (e) {
                        console.error('تعذر استرجاع جلسة Firebase:', e);
                        this.clearSession();
                    }
                },

                saveSession(userId) {
                    try {
                        localStorage.setItem(this.sessionKey, JSON.stringify({ userId, firebaseUid: firebaseAuth?.currentUser?.uid || '' }));
                    } catch (e) {
                        console.error('تعذر حفظ جلسة الدخول:', e);
                    }
                },

                clearSession() {
                    try {
                        localStorage.removeItem(this.sessionKey);
                    } catch (e) {
                        console.error('تعذر مسح جلسة الدخول:', e);
                    }
                },

                restoreLastAllowedView(user = this.currentUser) {
                    const savedView = localStorage.getItem('soliLastSection');
                    const savedPermission = this.viewPermissionMap?.[savedView];
                    const role = String(user?.role || '').toLowerCase();
                    const isManager = ['owner', 'admin'].includes(role);
                    if (savedView && (!savedPermission || isManager || user?.permissions?.[savedPermission])) {
                        this.currentView = savedView;
                    } else {
                        this.landOnAllowedPage(user);
                    }
                },

                // Wipes the local cached copy of the app's data on THIS browser only (a stale cache
                // is the most common cause of "changes not showing" or odd save errors). The page
                // reloads fresh afterwards, forcing the browser to re-read the current file/version.
                clearBrowserDataOnly() {
                    if (!confirm('سيتم حذف نسخة البيانات المخزنة على هذا المتصفح فقط. لن تُحذف أي بيانات من السحابة أو أجهزة الفريق، وستظل جلسة الدخول الحالية محفوظة. هل تريد المتابعة؟')) return;
                    try {
                        localStorage.removeItem(this.storageKey);

                        localStorage.removeItem(this.getV2MirrorStorageKey());

                        console.error('تعذر مسح البيانات المحلية:', e);

                },

                resetLocalData() {
                    return this.clearBrowserDataOnly();
                },

                openCloudResetModal() {
                    if (!['owner', 'admin'].includes(String(this.currentUser?.role || '').toLowerCase())) {
                        alert('هذا الإجراء متاح للمدير فقط.');
                        return;
                    }
                    this.cloudResetPasswordInput = '';

                    this.cloudResetDemoAcknowledgement = '';
                    this.cloudResetScopeConfirmation = '';
