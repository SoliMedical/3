                getCloudResetDataSnapshot() {
                    const snapshot = this.getSyncDataSnapshot();
                    // Credentials and clinic configuration remain available so the clinic can
                    // sign in again after a destructive records reset. All clinical/financial
                    // collections are cleared and then propagated through Firestore.
                    ['patients', 'visits', 'waitingQueue', 'appointments', 'invoices', 'prescriptions', 'expenses', 'syncConflicts'].forEach(key => {
                        snapshot[key] = [];
                    });
                    return snapshot;
                },

                getDemoResetV2CollectionNames() {
                    return ['patients', 'visits', 'appointments', 'invoices', 'prescriptions', 'expenses', 'waitingQueue', 'auditLogs', 'archiveManifests'];
                },

                applyCloudResetSnapshot(snapshot, token) {
                    this.applyingRemoteUpdate = true;
                    this.persistentKeys.forEach(key => {
                        if (snapshot[key] !== undefined) this[key] = snapshot[key];
                    });
                    this.cloudResetAcknowledgedToken = token || '';
                    this.syncRevision = Number(snapshot._syncMeta?.revision || this.syncRevision || 0);
                    this.syncJournal = {
                        ...this.normalizeSyncJournal(),
                        pendingState: false,
                        pendingOperations: [],
                        completedTombstones: [],
                        baseRevision: this.syncRevision,
                        lastAppliedRemoteRevision: this.syncRevision
                    };
                    this.localChangesPending = false;
                    this.localEditBaseRevision = this.syncRevision;
                    this.ensurePrescriptionPatientIds();
                    this.persistState();
                    this.renderIcons();
                    this.$nextTick(() => { this.applyingRemoteUpdate = false; });
                },

                async resetClinicDataEverywhere() {
                    if (this.cloudResetBusy) return;
                    if (!['owner', 'admin'].includes(String(this.currentUser?.role || '').toLowerCase())) {
                        alert('هذا الإجراء متاح للمدير فقط.');
                        return;
                    }
                    const identity = firebaseAuth?.currentUser;
                    const resetPassword = String(this.cloudResetPasswordInput || '');
                    if (!this.isPermanentFirebaseUser(identity) || !identity.email || resetPassword.length < 6) {
                        alert('أدخل كلمة مرور حساب Firebase للمدير، وتأكد من أن جلسة Firebase نشطة.');
                        return;
                    }
                    try {
                        const credential = firebase.auth.EmailAuthProvider.credential(identity.email, resetPassword);
                        await identity.reauthenticateWithCredential(credential);
                    } catch (error) {
                        alert('كلمة مرور Firebase غير صحيحة أو انتهت جلسة التحقق.');
                        return;
                    }
                    if (String(this.cloudResetDemoAcknowledgement || '').trim() !== 'بيانات تجريبية') {
                        alert('هذه العملية محجوبة لحماية بيانات المرضى. اكتب «بيانات تجريبية» لتأكيد أن العيادة لا تحتوي بيانات حقيقية.');
                        return;
                    }
                    if (String(this.cloudResetConfirmation || '').trim() !== 'حذف') {
                        alert('اكتب كلمة «حذف» في خانة التأكيد قبل المتابعة.');
                        return;
                    }
                    if (String(this.cloudResetScopeConfirmation || '').trim() !== 'حذف السحابة') {
                        alert('اكتب العبارة «حذف السحابة» لتأكيد أن العملية ستؤثر على جميع الأجهزة المتصلة.');
                        return;
                    }
                    if (String(this.cloudResetVersionConfirmation || '').trim() !== `إصدار ${this.appVersion}`) {
                        alert(`اكتب العبارة «إصدار ${this.appVersion}» للتأكد من أنك تعمل على الإصدار الصحيح.`);
                        return;
                    }
                    if (!confirm('تحذير نهائي: سيتم حذف بيانات العيادة التجريبية الطبية والمالية من المتصفح والسحابة وعلى جميع الأجهزة المتصلة. لا يمكن التراجع من هذه النافذة. هل تؤكد التنفيذ؟')) return;

                    this.cloudResetBusy = true;
                    const token = `RESET-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
                    const resetData = this.getCloudResetDataSnapshot();
                    resetData._resetMeta = {
                        token,
                        requestedAt: new Date().toISOString(),
                        requestedBy: this.currentUser?.fullName || 'المدير',
                        scope: 'explicit-demo-clinical-and-financial-records',
                        demoDataAcknowledged: true
                    };
                    try {
                        if (this.cloudSyncEnabled && this.cloudAuthReady && firestoreDB) {
                            const docRef = firestoreDB.doc(this.cloudDocPath);
                            const isOperational = this.isOperationalDocumentSyncActive();
                            const [legacySnapshot, ...v2Snapshots] = await Promise.all([
                                docRef.get({ source: 'server' }),
                                ...(isOperational ? this.getDemoResetV2CollectionNames().map(name => this.getOperationalCollectionQuery(name).get()) : [])
                            ]);
                            const v2Documents = v2Snapshots.flatMap(snapshot => snapshot.docs);
                            if (v2Documents.length > 400) {
                                throw new Error('demo-reset-document-limit');
                            }
                            const remoteMeta = legacySnapshot.exists ? (legacySnapshot.data()._syncMeta || {}) : {};
                            const revision = Number(remoteMeta.revision || this.syncRevision || 0) + 1;
                            resetData._syncMeta = {
                                revision,
                                writerId: this.syncDeviceId,
                                writerName: this.currentUser?.fullName || 'المدير',
                                updatedAt: new Date().toISOString(),
                                operation: 'explicit-demo-reset'
                            };
                            const batch = firestoreDB.batch();
                            batch.set(docRef, resetData, { merge: false });
                            v2Documents.forEach(document => batch.set(document.ref, this.sanitizeForFirestore({
                                _deleted: true,
                                _tombstoneVersion: 1,
                                sourceDocumentId: document.id,
                                deletedAt: new Date().toISOString(),
                                resetToken: token,
                                resetBy: this.currentUser?.fullName || 'المدير',
                                schemaVersion: this.isTopLevelOperationalSyncActive() ? 3 : 2,
                                ...(this.isTopLevelOperationalSyncActive() ? { clinicId: String(this.cloudClinicId) } : {})
                            }), { merge: true }));
                            await batch.commit();
                            this.v2MirrorFingerprints = {};
                            this.saveV2MirrorFingerprints();
                            this.cloudStatus = 'online';
                        } else {
                            this.cloudStatus = 'offline';
                            alert('لا يوجد اتصال سحابي حالياً؛ سيتم تطبيق إعادة الضبط على هذا الجهاز فقط. أعد الاتصال ثم نفّذ الإجراء مرة أخرى لحذف البيانات من جميع الأجهزة.');
                            return;
                        }
                        this.applyCloudResetSnapshot(resetData, token);
                        this.showCloudResetModal = false;
                        this.cloudResetPasswordInput = '';
                        this.cloudResetConfirmation = '';
                        this.cloudResetDemoAcknowledgement = '';
                        this.cloudResetScopeConfirmation = '';
                        this.cloudResetVersionConfirmation = '';
                        alert('تم حذف السجلات التجريبية الطبية والمالية من السحابة وتفريغها على الأجهزة المتصلة بنجاح.');
                    } catch (error) {
                        console.error('تعذر تنفيذ إعادة الضبط السحابية:', error);
                        this.cloudStatus = 'offline';
                        if (error?.message === 'demo-reset-document-limit') {
                            alert('تم إيقاف الإجراء لأن عدد وثائق V2 أكبر من الحد الآمن لإعادة ضبط بيانات تجريبية من زر واحد. لم تُمسح أي بيانات؛ نزّل نسخة احتياطية وراجع الخطة الإدارية أولاً.');
                        } else {
                            alert('تعذر تنفيذ الحذف السحابي. لم تُمسح البيانات المحلية؛ تحقق من الاتصال وقواعد Firestore ثم أعد المحاولة.');
                        }
                    } finally {
                        this.cloudResetBusy = false;
                    }
                },

                downloadClinicBackup() {
                    try {
                        this.persistState();
                        const backupData = {};
                        this.persistentKeys.forEach(key => { backupData[key] = this[key]; });
                        const payload = {
                            format: 'soli-medical-backup',
                            version: 1,
                            appName: 'Soli Medical',
                            exportedAt: new Date().toISOString(),
                            theme: this.darkMode ? 'dark' : 'light',
                            data: backupData
                        };
                        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const anchor = document.createElement('a');
                        const stamp = new Date().toISOString().replace(/[:.]/g, '-');
                        anchor.href = url;
                        anchor.download = `soli-medical-backup-${stamp}.json`;
                        document.body.appendChild(anchor);
                        anchor.click();
                        anchor.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                        const visitCount = this.patients.reduce((sum, patient) => sum + (Array.isArray(patient.records) ? patient.records.length : 0), 0);
                        this.backupInfo = `تم تنزيل نسخة احتياطية تشمل ${this.patients.length} مريضاً و${visitCount} زيارة.`;
                    } catch (err) {
                        console.error('تعذر إنشاء النسخة الاحتياطية:', err);
                        this.backupInfo = 'تعذر إنشاء النسخة الاحتياطية. تأكد من توفر مساحة تخزين في المتصفح ثم أعد المحاولة.';
                    }
                },

                handleBackupImport(event) {
                    const file = event.target.files?.[0];
                    if (!file) return;
                    const input = event.target;
                    const reader = new FileReader();
                    reader.onload = () => {
                        try {
                            const payload = JSON.parse(reader.result);
                            const source = payload?.data && typeof payload.data === 'object' ? payload.data : payload;
                            const validKeys = this.persistentKeys.filter(key => Object.prototype.hasOwnProperty.call(source, key));
                            if (!validKeys.length || !Array.isArray(source.patients) || !Array.isArray(source.users)) {
                                throw new Error('invalid-backup');
                            }
                            const patientCount = source.patients.length;
                            const visitCount = source.patients.reduce((sum, patient) => sum + (Array.isArray(patient.records) ? patient.records.length : 0), 0);
                            const approved = confirm(`سيتم استبدال البيانات المحلية الحالية بنسخة تحتوي على ${patientCount} مريضاً و${visitCount} زيارة. يُنصح بأخذ نسخة احتياطية حالية أولاً. هل تريد المتابعة؟`);
                            if (!approved) return;
                            this.applyingRemoteUpdate = true;
                            validKeys.forEach(key => { this[key] = source[key]; });
                            this.persistState();
                            if (payload.theme === 'light') this.darkMode = false;
                            if (payload.theme === 'dark') this.darkMode = true;
                            this.backupInfo = `تمت استعادة ${patientCount} مريضاً و${visitCount} زيارة. ستتم إعادة تحميل التطبيق لتطبيق البيانات بالكامل.`;
                            this.renderIcons();
                            setTimeout(() => window.location.reload(), 700);
                        } catch (err) {
                            console.error('تعذر استعادة النسخة الاحتياطية:', err);
                            this.backupInfo = 'ملف النسخة الاحتياطية غير صالح أو لا ينتمي إلى Soli Medical.';
                        } finally {
                            input.value = '';
                        }
                    };
                    reader.onerror = () => {
                        input.value = '';
                        this.backupInfo = 'تعذر قراءة ملف النسخة الاحتياطية.';
                    };
                    reader.readAsText(file);
                },

                // ---- COMMERCIAL LOCAL EDITION TOOLS ----
                recordAudit(action, details = '') {
                    const entry = {
                        id: `AUD-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                        at: new Date().toISOString(),
                        user: this.currentUser?.fullName || 'النظام المحلي',
                        action,
                        details
                    };
                    this.auditLog = [entry, ...(this.auditLog || [])].slice(0, 250);
                    this.persistState();
                    this.queueCloudSync();
                    this.queueV2AuditEntry(entry);
                },
                queueV2AuditEntry(entry) {
                    if (!entry || this.dataMigration?.status !== 'completed' || !firestoreDB || !navigator.onLine || !this.cloudAuthReady) return;
                    this.getV2Collection('auditLogs').doc(this.safeFirestoreId(entry.id, `audit-${Date.now()}`)).set(this.sanitizeForFirestore({
                        ...entry,
                        schemaVersion: 2,
                        migrationId: this.dataMigration.migrationId,
                        mirroredAt: new Date().toISOString()
                    }), { merge: true }).catch(error => {
                        console.warn('سيعاد تضمين سجل التدقيق في مزامنة V2 التالية:', error);
                        this.queueV2MirroredChanges();
                    });
                },
                createArchiveManifest(recordType, records, reason) {
                    const manifest = {
                        id: `ARCH-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                        recordType,
                        status: 'archived',
                        reason,
                        recordIds: (records || []).map(record => String(record?.id || '')).filter(Boolean),
                        count: (records || []).length,
                        archivedAt: new Date().toISOString(),
                        archivedBy: this.currentUser?.id || 'admin',
                        reversible: true
                    };
                    this.archiveManifests = [manifest, ...(this.archiveManifests || [])].slice(0, 250);
                    return manifest;
                },
                markArchiveRecordRestored(recordType, recordId) {
                    this.archiveManifests = (this.archiveManifests || []).map(manifest => {
                        if (manifest.recordType !== recordType || !manifest.recordIds?.includes(String(recordId))) return manifest;
                        return { ...manifest, status: 'partially_restored', restoredAt: new Date().toISOString(), restoredBy: this.currentUser?.id || 'admin' };
                    });
                },
                registerAuditActivityListeners() {
                    if (this._activityListenersRegistered) return;
                    this._activityListenersRegistered = true;
                    const markActivity = () => { this.lastActivityAt = Date.now(); };
                    ['click', 'keydown', 'pointerdown', 'touchstart'].forEach(eventName => {
                        window.addEventListener(eventName, markActivity, { passive: true });
                    });
                },
                startIdleLockMonitor() {
                    clearInterval(this.idleLockTimer);
                    this.idleLockTimer = setInterval(() => {
                        if (!this.idleLockEnabled || !this.isAuthenticated || this.showIdleLockModal) return;
                        const timeout = Math.max(0, Number(this.idleLockMinutes || 0)) * 60 * 1000;
                        if (timeout > 0 && Date.now() - Number(this.lastActivityAt || Date.now()) >= timeout) {
                            this.engageIdleLock('idle_timeout');
                        }
                    }, 30000);
                },
                getIdleLockOwnerId() {
                    return String(this.currentUser?.firebaseUid || firebaseAuth?.currentUser?.uid || this.currentUser?.id || '');
                },
                engageIdleLock(reason = 'manual') {
                    if (!this.idleLockEnabled || !this.isAuthenticated) return false;
                    this.showIdleLockModal = true;
                    this.idleUnlockPassword = '';
                    try {
                        localStorage.setItem(this.idleLockStorageKey, JSON.stringify({ ownerId: this.getIdleLockOwnerId(), lockedAt: new Date().toISOString(), reason }));
                    } catch (error) {}
                    this.recordAudit('قفل تلقائي', reason === 'idle_timeout' ? `بعد ${this.idleLockMinutes} دقيقة من عدم النشاط` : 'تم قفل الشاشة');
                    this.persistState();
                    return true;
                },
                restoreIdleLockState() {
                    if (!this.idleLockEnabled || !this.isAuthenticated) return false;
                    try {
                        const saved = JSON.parse(localStorage.getItem(this.idleLockStorageKey) || 'null');
                        if (!saved?.ownerId || saved.ownerId !== this.getIdleLockOwnerId()) return false;
                        this.showIdleLockModal = true;
                        this.idleUnlockPassword = '';
                        this.lastActivityAt = Date.parse(saved.lockedAt) || Date.now();
                        return true;
                    } catch (error) { return false; }
                },
                clearIdleLockState() {
                    try { localStorage.removeItem(this.idleLockStorageKey); } catch (error) {}
                },
                toggleIdleLockSetting() {
                    this.idleLockEnabled = !this.idleLockEnabled;
                    if (!this.idleLockEnabled) {
                        this.showIdleLockModal = false;
                        this.clearIdleLockState();
                    }
                    this.lastActivityAt = Date.now();
                    this.startIdleLockMonitor();
                    this.persistState();
                },
                async unlockIdleSession() {
                    const identity = firebaseAuth?.currentUser;
                    const password = String(this.idleUnlockPassword || '');
                    if (!this.isPermanentFirebaseUser(identity) || !identity.email || !password) {
                        alert('لا توجد جلسة Firebase نشطة لفتح القفل. سجّل الدخول من جديد.');
                        return;
                    }
                    try {
                        const credential = firebase.auth.EmailAuthProvider.credential(identity.email, password);
                        await identity.reauthenticateWithCredential(credential);
                    } catch (error) {
                        alert('كلمة مرور Firebase غير صحيحة.');
                        return;
                    }
                    this.showIdleLockModal = false;
                    this.idleUnlockPassword = '';
                    this.lastActivityAt = Date.now();
                    this.clearIdleLockState();
                    this.recordAudit('فتح القفل التلقائي');
                    this.persistState();
                },
                canReceiveWaitingArrivalAlerts() {
                    const role = String(this.currentUser?.role || '').toLowerCase();
                    return Boolean(this.isAuthenticated && (['owner', 'admin', 'doctor', 'clinician'].includes(role) || this.currentUser?.permissions?.waitingQueue));
                },
                observeWaitingQueueArrivals(items) {
                    const queue = Array.isArray(items) ? items : [];
                    const ids = new Set(queue.map(item => String(item?.id || '')).filter(Boolean));
                    queue.forEach(item => {
                        const id = String(item?.id || '');
                        if (!id || this.waitingArrivalKnownIds.has(id) || item?.archivedAt) return;
                        if (item?.status !== 'waiting') return;
                        if (item?.createdBy && String(item.createdBy) === String(this.currentUser?.id)) return;
                        this.announceWaitingArrival(item, 'queue_update');
                    });
                    this.waitingArrivalKnownIds = ids;
                },
                announceWaitingArrival(item, source = 'check_in') {
                    const id = String(item?.id || '');
                    if (!id || this.waitingArrivalNotifiedIds.has(id) || !this.canReceiveWaitingArrivalAlerts()) return false;
                    this.waitingArrivalNotifiedIds.add(id);
                    this.waitingArrivalNotice = { id, patientName: String(item.patientName || 'مريض جديد'), source, receivedAt: new Date().toISOString() };
                    if (this.waitingArrivalNoticeTimer) clearTimeout(this.waitingArrivalNoticeTimer);
                    this.waitingArrivalNoticeTimer = setTimeout(() => { this.waitingArrivalNotice = null; }, 15000);
                    this.showFlashNotice(`وصل ${this.waitingArrivalNotice.patientName} إلى قائمة الانتظار`);
                    this.playWaitingArrivalTone();
                    this.renderIcons();
                    return true;
                },
                playWaitingArrivalTone(preview = false) {
                    if (!this.waitingArrivalSoundEnabled && !preview) return;
                    try {
                        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                        if (!AudioContextClass) return;
                        const context = this.waitingArrivalAudioContext || new AudioContextClass();
                        this.waitingArrivalAudioContext = context;
                        if (context.state === 'suspended') context.resume();
                        const oscillator = context.createOscillator();
                        const gain = context.createGain();
                        oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(880, context.currentTime);
                        gain.gain.setValueAtTime(0.0001, context.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.11, context.currentTime + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.42);
                        oscillator.connect(gain).connect(context.destination);
                        oscillator.start(); oscillator.stop(context.currentTime + 0.45);
                    } catch (error) { console.warn('تعذر تشغيل تنبيه وصول المريض:', error); }
                },
                toggleWaitingArrivalSound() {
                    this.waitingArrivalSoundEnabled = !this.waitingArrivalSoundEnabled;

                handleClinicLogoUpload(event) {

                        event.target.value = '';
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = () => {
                        const image = new Image();
                        image.onload = async () => {
                            const maxDimension = 512;
                            const scale = Math.min(1, maxDimension / image.width, maxDimension / image.height);
                            const canvas = document.createElement('canvas');
                            canvas.width = Math.max(1, Math.round(image.width * scale));
                            canvas.height = Math.max(1, Math.round(image.height * scale));
                            const context = canvas.getContext('2d');
                            context.clearRect(0, 0, canvas.width, canvas.height);
                            context.drawImage(image, 0, 0, canvas.width, canvas.height);
                            const compressedLogo = canvas.toDataURL('image/webp', 0.9);
                            if (compressedLogo.length > 1_250_000) {
                                alert('تعذر تجهيز الشعار لأن حجمه بعد الضغط كبير. اختر صورة أبسط أو أقل دقة.');
                                return;
                            }
                            this.clinicLogoDataUrl = compressedLogo;
                            this.pendingClinicLogoDataUrl = compressedLogo;
                            this.persistState();
                            event.target.value = '';
                            this.renderIcons();
                            await this.uploadClinicLogoDataUrl(compressedLogo);
                        };
                        image.onerror = () => alert('تعذر قراءة صورة الشعار. جرّب ملف PNG أو JPG آخر.');
                        image.src = reader.result;

                async buildLocalCredential(password) {
                    if (!window.crypto?.subtle) throw new Error('يتطلب حفظ كلمة المرور متصفحاً حديثاً واتصال HTTPS.');
                    const salt = crypto.getRandomValues(new Uint8Array(16));
                    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(password)), 'PBKDF2', false, ['deriveBits']);
                    const iterations = 210000;
                    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, material, 256);
                    const encode = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));
                    return { version: 1, algorithm: 'PBKDF2-SHA-256', iterations, salt: encode(salt), hash: encode(bits), updatedAt: new Date().toISOString() };
                },

                async verifyLocalCredential(user, password) {
                    if (!user?.localCredential) {
                        return String(user?.email || '').trim().toLowerCase() === 'admin' && String(password) === '55555555';
                    }
                    const credential = user.localCredential;
                    if (!window.crypto?.subtle || credential.algorithm !== 'PBKDF2-SHA-256' || !credential.salt || !credential.hash) return false;
                    const salt = Uint8Array.from(atob(credential.salt), character => character.charCodeAt(0));
                    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(password)), 'PBKDF2', false, ['deriveBits']);
                    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: Number(credential.iterations || 210000), hash: 'SHA-256' }, material, 256);
                    const actual = new Uint8Array(bits);
                    const expected = Uint8Array.from(atob(credential.hash), character => character.charCodeAt(0));
                    if (actual.length !== expected.length) return false;
                    let difference = 0;
                    actual.forEach((byte, index) => { difference |= byte ^ expected[index]; });
                    return difference === 0;
                },

                    this.auditLog = [{

                    }, ...(this.auditLog || [])].slice(0, 100);
                },

                async saveAccountProfile() {
                    if (!['admin', 'owner'].includes(String(this.currentUser?.role || ''))) return;
                    const user = this.users.find(candidate => String(candidate.id) === String(this.accountProfileForm.userId));
                    if (!user) return;
                    if (this.isProtectedSystemOwner(user)) {
                        this.accountProfileFeedback = 'حساب مدير النظام محمي ولا يمكن تعديل بياناته من هذه البطاقة.';
                        this.showFlashNotice(this.accountProfileFeedback, 'error');
                        return;
                    }
                    const fullName = String(this.accountProfileForm.fullName || '').trim();
                    const username = String(this.accountProfileForm.username || '').trim().toLowerCase();
                    if (!fullName) {
                        this.accountProfileFeedback = 'اكتب الاسم المعروض للحساب.';
                        this.showFlashNotice(this.accountProfileFeedback, 'error');
                        return;
                    }
                    if (!/^[\p{L}\p{N}][\p{L}\p{N}._-]{1,78}[\p{L}\p{N}]$/u.test(username) || username.includes('@')) {
                        this.accountProfileFeedback = 'استخدم اسم مستخدم من حروف أو أرقام فقط، دون بريد أو مسافات.';
                        this.showFlashNotice(this.accountProfileFeedback, 'error');
                        return;
                    }
                    if (isFirebaseConfigured) {
                        if (!clinicAccountGatewayUrl) {
                            user.fullName = fullName;
                            user.email = username;
                            if (String(this.currentUser?.id) === String(user.id)) this.currentUser = this.withCompatiblePermissions(user);
                            this.persistState();
                            await this.persistUsersToCloudNow();
                            this.accountProfileFeedback = 'تم حفظ الاسم المعروض واسم المستخدم بنجاح.';
                            this.showFlashNotice(this.accountProfileFeedback);
                            return;
                        }
                        this.selfServiceAccountBusy = true;
                        try {
                            await this.callAdminApi('/api/admin/users/update', { body: { uid: String(user.id), displayName: fullName, username } });
                            await this.loadManagedFirebaseUsers();
                            const updated = this.users.find(candidate => String(candidate.id) === String(user.id));
                            this.accountProfileForm = { userId: String(updated?.id || user.id), fullName: String(updated?.fullName || fullName), username: String(updated?.email || username) };
                            this.accountProfileFeedback = 'تم حفظ الاسم المعروض واسم المستخدم بأمان.';
                            this.showFlashNotice(this.accountProfileFeedback);
                        } catch (error) {
                            this.accountProfileFeedback = error?.message || this.apiReadyMessage();
                            this.showFlashNotice(this.accountProfileFeedback, 'error');
                        } finally {
                            this.selfServiceAccountBusy = false;
                        }
                        return;
                    }
                    if (this.users.some(candidate => String(candidate.id) !== String(user.id) && String(candidate.email || '').trim().toLowerCase() === username)) {
                        this.accountProfileFeedback = 'اسم المستخدم مستخدم بالفعل.';
                        this.showFlashNotice(this.accountProfileFeedback, 'error');
                        return;
                    }
                    const previousUsername = user.email;
                    user.fullName = fullName;
                    user.email = username;
                    user.firebaseAuthStatus = this.cloudSyncEnabled ? user.firebaseAuthStatus : 'local_pending';
                    if (String(this.currentUser?.id) === String(user.id)) this.currentUser = this.withCompatiblePermissions(user);
                    if (String(this.doctorInfo?.email || '').trim().toLowerCase() === String(previousUsername || '').trim().toLowerCase()) this.doctorInfo.email = username;
                    this.recordLocalAccountAudit('تعديل بيانات الحساب', username);
                    this.persistState();
                    this.accountProfileFeedback = this.cloudSyncEnabled
                        ? 'تم حفظ بيانات الحساب محلياً؛ ستتم مطابقتها مع Firebase من مسار الإدارة الآمن عند تفعيله.'
                        : 'تم الحفظ على هذا الجهاز. لن تتغير هوية Firebase إلا بعد ربط إدارة الحسابات بالخادم الآمن.';
                    this.showFlashNotice(this.accountProfileFeedback);
                },

                async handleLogin() {
                    this.isLoading = true;
                    this.loginError = '';
                    const enteredLogin = String(this.loginForm.email || '').trim().toLowerCase();
                    const enteredPassword = String(this.loginForm.password || '');
                    if (isFirebaseConfigured && firebaseAuth) {
                        try {
                            if (!navigator.onLine) throw new Error('يلزم اتصال بالإنترنت لتسجيل الدخول الآمن.');
                            const internalEmail = await firebaseEmailForUsername(enteredLogin);
                            const credential = await firebaseAuth.signInWithEmailAndPassword(internalEmail, enteredPassword);
                            const membershipActive = await this.refreshFirebaseMembershipStatus(credential.user);
                            const firebaseUser = membershipActive ? await this.hydrateLocalUserFromFirebaseUser(credential.user) : null;
                            if (!membershipActive || !firebaseUser || firebaseUser.active === false) {
                                await firebaseAuth.signOut().catch(() => {});
                                this.loginError = membershipActive
                                    ? 'هذا الحساب موقوف أو لا يملك ملف مستخدم نشطاً.'
                                    : 'لا توجد عضوية عيادة نشطة لهذا الحساب.';
                                return;
                            }
                            this.currentUser = firebaseUser;
                            this.isAuthenticated = true;
                            this.cloudSyncEnabled = true;
                            this.cloudAuthReady = true;
                            this.cloudMembershipReady = true;
                            this.cloudStatus = 'online';
                            this.loginForm.password = '';
                            this.saveSession(firebaseUser.id);
                            this.landOnAllowedPage(firebaseUser);
                            this.renderIcons();
                            // تسجيل الدخول الناجح كان يضع الحالة online دون تشغيل قارئ V2.
                            // ابدأ المزامنة هنا فور اكتمال الهوية والعضوية حتى تُقرأ البيانات من الخادم.
                            this.startCloudSync();
                            return;
                        } catch (error) {
                            await firebaseAuth.signOut().catch(() => {});
                            await this.prepareUsersForOnlineLogin().catch(() => {});
                            const localUser = (this.users || []).find(user => String(user.email || '').trim().toLowerCase() === enteredLogin);
                            if (localUser && localUser.active && (await this.verifyLocalCredential(localUser, enteredPassword))) {
                                this.currentUser = this.withCompatiblePermissions(localUser);
                                this.isAuthenticated = true;
                                this.loginForm.password = '';
                                this.saveSession(localUser.id);
                                this.landOnAllowedPage(this.currentUser);
                                this.renderIcons();
                                this.cloudSyncEnabled = true;
                                this.cloudStatus = 'online';
                                this.startCloudSync();
                                this.isLoading = false;
                                return;
                            }
                            this.loginError = error?.message === 'يلزم اتصال بالإنترنت لتسجيل الدخول الآمن.'
                                ? error.message
                                : this.firebaseIdentityErrorMessage(error);
                            return;
                        } finally {
                            this.isLoading = false;
                        }
                    }
                    const localUser = this.users.find(user => String(user.email || '').trim().toLowerCase() === enteredLogin);
                    if (!localUser || !localUser.active) {
                        this.loginError = 'اسم المستخدم غير موجود أو أن الحساب موقوف محلياً.';
                    } else if (!(await this.verifyLocalCredential(localUser, enteredPassword))) {
                        this.loginError = 'كلمة المرور المحلية غير صحيحة.';
                    } else {
                        this.currentUser = this.withCompatiblePermissions(localUser);
                        this.isAuthenticated = true;
                        this.loginForm.password = '';
                        this.saveSession(localUser.id);
                        this.landOnAllowedPage(this.currentUser);
                        this.renderIcons();
                        this.cloudSyncEnabled = false;
                        this.cloudStatus = 'offline';
                    }
                    this.isLoading = false;
                },
                logout() {
                    this.isAuthenticated = false;
                    this.currentUser = null;
                    this.currentView = 'dashboard';
                    this.loginForm.password = '';
                    this.clearSession();
                    if (this.cloudSyncEnabled) {
                        firebaseAuth.signOut().catch(() => {});
                    }
                },

                async callClinicAccountGateway(action, user, options = {}) {
                    if (!clinicAccountGatewayUrl) throw new Error('مسار الإدارة الذاتية غير مهيأ بعد.');
                    if (!navigator.onLine) throw new Error('تحتاج إدارة حسابات الفريق إلى اتصال بالإنترنت. تبقى بيانات العيادة محفوظة محلياً.');
                    const identity = firebaseAuth?.currentUser;
                    if (!this.isPermanentFirebaseUser(identity)) {
                        throw new Error('سجّل دخول مالك العيادة بهوية Firebase دائمة أولاً ثم أعد المحاولة.');
                    }
                    const token = await identity.getIdToken(true);
                    const response = await fetch(clinicAccountGatewayUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                        body: JSON.stringify({
                            action,
                            member: {
                                localUserId: String(user.id ?? ''),
                                fullName: String(user.fullName || '').trim(),
                                email: String(user.email || '').trim(),
                                firebaseEmail: String(user.firebaseEmail || '').trim() || undefined,
                                password: action === 'upsert' && options.password ? String(options.password) : undefined,
                                newPassword: action === 'changePassword' && options.newPassword ? String(options.newPassword) : undefined,
                                role: String(user.role || '').trim(),
                                active: user.active !== false,
                                firebaseUid: String(user.firebaseUid || '').trim() || undefined
                            }
                        })
                    });
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok || !payload?.ok) throw new Error(payload?.message || 'تعذر تنفيذ إدارة الحساب بأمان.');
                    return payload.result;
                },

                async sendFirebasePasswordResetForUser(userId) {

                    if (!user || !email.includes('@') || !firebaseAuth || !navigator.onLine) {
                        this.selfServiceAccountMessage = 'يتطلب إرسال رابط تغيير كلمة المرور اتصالاً بFirebase وبريدًا صالحًا.';
                        return false;
                    }
                    try {
                        await firebaseAuth.sendPasswordResetEmail(email);
                        this.selfServiceAccountMessage = `تم إرسال رابط تغيير كلمة المرور إلى ${email}.`;
                        return true;
                    } catch (error) {
                        this.selfServiceAccountMessage = this.firebaseIdentityErrorMessage(error);

                },

                async changeUserPassword() {
                    if (!['admin', 'owner'].includes(String(this.currentUser?.role || ''))) {
                        this.passwordChangeMessage = 'تغيير كلمات المرور متاح لمدير النظام فقط.';
                        return false;
                    }
                    const user = this.users.find(candidate => String(candidate.id) === String(this.passwordChangeForm.userId));
                    const newPassword = String(this.passwordChangeForm.newPassword || '').trim();
                    const confirmPassword = String(this.passwordChangeForm.confirmPassword || '').trim();
                    if (!user) {
                        this.passwordChangeMessage = 'لم يتم العثور على الحساب المطلوب.';
                        return false;
                    }
                    if (newPassword.length < 8) {
                        this.passwordChangeMessage = 'كلمة المرور يجب ألا تقل عن 8 أحرف أو أرقام.';
                        return false;
                    }
                    if (newPassword !== confirmPassword) {
                        this.passwordChangeMessage = 'تأكيد كلمة المرور غير مطابق.';
                        return false;
                    }
                    this.selfServiceAccountBusy = true;
                    const localGatewayUrl = ["localhost", "127.0.0.1", "::1", "[::1]"].includes(window.location.hostname)
                        ? window.location.origin
                        : '';
                    const gatewayUrl = clinicAccountGatewayUrl || localGatewayUrl;
                    if (isFirebaseConfigured && firebaseAuth?.currentUser && gatewayUrl) {
                        try {
                            const identity = firebaseAuth.currentUser;
                            const token = await identity.getIdToken(true);
                            const response = await fetch(`${gatewayUrl}/api/admin/users/reset-password`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                                    body: JSON.stringify({ uid: String(user.firebaseUid || user.id), password: newPassword })
                            });
                            const payload = await response.json().catch(() => ({}));
                            if (!response.ok || !payload?.ok) {
                                const gatewayError = new Error(payload?.message || `تعذر تغيير كلمة مرور حساب الفريق (HTTP ${response.status}).`);
                                gatewayError.code = `gateway-http-${response.status}`;
                                throw gatewayError;
                            }
                            this.passwordChangeForm.newPassword = '';
                            this.passwordChangeForm.confirmPassword = '';
                            this.passwordChangeMessage = 'تم تغيير كلمة مرور حساب الفريق بنجاح.';
                            return true;
                        } catch (error) {
                            this.passwordChangeMessage = this.firebaseIdentityErrorMessage(error);
                            return false;
                        } finally {
                            this.selfServiceAccountBusy = false;
                        }
                    }
                    try {
                        const localCredential = await this.buildLocalCredential(newPassword);
                        user.localCredential = localCredential;
                        if (this.currentUser && String(this.currentUser.id) === String(user.id)) {
                            this.currentUser.localCredential = localCredential;
                        }
                        this.persistState();
                        await this.persistUsersToCloudNow();
                        this.passwordChangeForm.newPassword = '';
                        this.passwordChangeForm.confirmPassword = '';
                        this.passwordChangeMessage = 'تم تغيير كلمة المرور بنجاح وحفظ التعديل في السحابة.';
                        return true;
                    } catch (error) {
                        this.passwordChangeMessage = 'تعذر تغيير كلمة المرور. حاول مرة أخرى.';
                        return false;
                    } finally {
                        this.selfServiceAccountBusy = false;
                    }
                    this.passwordChangeMessage = 'Firebase غير جاهز الآن. تحقق من الاتصال وإعداد التطبيق ثم أعد المحاولة.';
                    this.selfServiceAccountBusy = false;
                    return false;
                },
                async syncUserMembership(userId, options = {}) {
                    const user = this.users.find(candidate => String(candidate.id) === String(userId));
                    const firebasePassword = String(options.firebasePassword || '');
                    if (!user) return false;
                    this.selfServiceAccountBusy = true;
                    this.selfServiceAccountMessage = 'جارٍ تحديث حساب المستخدم والحفظ في السحابة...';
                    if (!clinicAccountGatewayUrl) {
                        user.firebaseAuthStatus = 'active';
                        this.persistState();
                        await this.persistUsersToCloudNow();
                        this.selfServiceAccountBusy = false;
                        this.selfServiceAccountMessage = options.silent ? '' : 'تم تفعيل حساب الفريق والحفظ في السحابة بنجاح.';
                        this.renderIcons();
                        return true;
                    }
                    try {
                        const result = await this.callClinicAccountGateway('upsert', user, { password: firebasePassword });
                        user.firebaseUid = result.uid;
                        user.firebaseAuthStatus = result.status;
                        this.persistState();
                        const cloudResult = await this.persistUsersToCloudNow();
                        if (navigator.onLine && this.cloudSyncEnabled && !cloudResult.ok) {
                            this.selfServiceAccountMessage = 'تم تفعيل الحساب، وستُعاد مزامنة قائمة المستخدمين تلقائياً عند استقرار الاتصال.';
                        } else {
                            this.selfServiceAccountMessage = options.silent ? '' : 'تم تفعيل حساب الفريق وعضويته السحابية بنجاح.';
                        }
                        this.renderIcons();
                        return true;
                    } catch (error) {
                        user.firebaseAuthStatus = 'membership_pending';
                        this.persistState();
                        this.selfServiceAccountMessage = error?.message || 'تعذر تفعيل الحساب. لم تُحذف أية بيانات.';
                        return false;
                    } finally {
                        this.selfServiceAccountBusy = false;
                    }
                },
