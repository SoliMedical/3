                escapePrintHtml(value) {
                    return String(value || '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char]);
                },
                updateAppointmentStatus(id, status) {
                    const appointment = (this.appointments || []).find(item => item.id === id);
                    if (!appointment) return;
                    appointment.status = status;
                    if (status === 'waiting') this.ensureAppointmentQueueLink(appointment);
                    if (status === 'in_consultation') {
                        this.ensureAppointmentQueueLink(appointment);
                        const queueItem = (this.waitingQueue || []).find(item => String(item.appointmentId || '') === String(id));
                        if (queueItem) queueItem.status = 'in_consultation';
                        this.archiveAppointmentFromActiveCalendar(appointment, 'consultation_started');
                    }
                    if (status === 'completed') this.completeAppointment(appointment);
                    if (status === 'cancelled') this.waitingQueue = (this.waitingQueue || []).filter(item => String(item.appointmentId || '') !== String(id));
                    if (['waiting', 'in_consultation', 'completed'].includes(status)) this.ensureAppointmentFinancialLink(appointment);
                    this.recordAudit('تغيير حالة موعد', appointment.patientName + ': ' + this.appointmentStatusLabel(status));
                    this.persistState();
                    this.queueCloudSync();
                },
                getRefundableWaitingInvoices(item) {
                    const queueId = String(item?.id || '');
                    const patientId = item?.patientId;
                    const patientName = String(item?.patientName || '').trim();
                    const queueDate = String(item?.createdAt || new Date().toISOString()).slice(0, 10);
                    return (this.invoices || []).filter(invoice => {
                        const status = String(invoice?.status || 'مدفوعة').trim();
                        const isCollected = !['غير مدفوعة', 'غير مدفوع', 'ملغي'].includes(status);
                        if (!isCollected) return false;
                        const explicitlyLinked = (queueId && String(invoice.waitingQueueId || '') === queueId) || (item?.invoiceId && String(invoice.id) === String(item.invoiceId));
                        if (explicitlyLinked) return true;
                        const isLegacyVisitCharge = String(invoice.source || '') === 'waiting_checkin' || String(invoice.serviceName || '').startsWith('رسوم ');
                        const samePatient = (patientId != null && String(invoice.patientId || '') === String(patientId)) || (!!patientName && String(invoice.patientName || '').trim() === patientName);
                        return isLegacyVisitCharge && samePatient && String(invoice.date || '').slice(0, 10) === queueDate;
                    });
                },
                removeWaitingWithPaymentRefund(item, actionLabel = 'إزالة') {
                    if (!item) return false;
                    const refundableInvoices = this.getRefundableWaitingInvoices(item);
                    const refundedAmount = refundableInvoices.reduce((sum, invoice) => sum + this.invoiceNetTotal(invoice), 0);
                    const patientName = item.patientName || 'هذا المريض';
                    const hasRefund = refundableInvoices.length > 0;
                    const message = hasRefund
                        ? `سيتم ${actionLabel} ${patientName} من قائمة الانتظار واسترداد مبلغ ${refundedAmount.toLocaleString('ar-EG')} ج.م عبر حذف التحصيل المرتبط فقط. لن يتم حذف ملف المريض أو زياراته. هل تريد المتابعة؟`
                        : `لا يوجد تحصيل مدفوع مرتبط بهذه البطاقة. سيتم ${actionLabel} ${patientName} من قائمة الانتظار فقط، ولن يتم حذف ملف المريض أو زياراته. هل تريد المتابعة؟`;
                    if (!confirm(message)) return false;
                    this.markLocalSyncChange();
                    const refundedInvoiceIds = new Set(refundableInvoices.map(invoice => String(invoice.id)));
                    if (this.isOperationalDocumentSyncActive()) {
                        refundableInvoices.forEach(invoice => {
                            if (invoice?.id != null) this.queueCloudDeleteOperation('invoices', invoice.id, invoice.patientId ?? item.patientId);
                        });
                        if (item.id != null) this.queueCloudDeleteOperation('waitingQueue', item.id, item.patientId);
                    }
                    if (refundedInvoiceIds.size) this.invoices = (this.invoices || []).filter(invoice => !refundedInvoiceIds.has(String(invoice.id)));
                    this.waitingQueue = (this.waitingQueue || []).filter(entry => String(entry.id) !== String(item.id));
                    const appointment = (this.appointments || []).find(entry => entry.id === item.appointmentId);
                    if (appointment) appointment.status = 'cancelled';
                    this.recordAudit(`${actionLabel} من قائمة الانتظار`, `${patientName} — ${hasRefund ? `استرداد ${refundedAmount.toLocaleString('ar-EG')} ج.م وحذف ${refundedInvoiceIds.size} تحصيل` : 'لا يوجد تحصيل مرتبط'}`);
                    this.persistState();
                    this.queueCloudSync();
                    alert(hasRefund ? `تم ${actionLabel} المريض واسترداد ${refundedAmount.toLocaleString('ar-EG')} ج.م من سجل التحصيل.` : `تم ${actionLabel} المريض من قائمة الانتظار دون وجود تحصيل مرتبط.`);
                    return true;
                },
                setWaitingStatus(item, status, selectElement = null) {
                    if (!item) return;
                    if (status === 'cancelled') {
                        const removed = this.removeWaitingWithPaymentRefund(item, 'إلغاء');
                        if (!removed && selectElement) selectElement.value = item.status || 'waiting';
                        return;
                    }
                    item.status = status;
                    const appointment = (this.appointments || []).find(appt => String(appt.id) === String(item.appointmentId));
                    if (appointment) {
                        appointment.status = status;
                        if (status === 'completed') this.completeAppointment(appointment);
                        else if (status === 'in_consultation') {
                            this.ensureAppointmentQueueLink(appointment);
                            this.archiveAppointmentFromActiveCalendar(appointment, 'consultation_started');
                        }
                    }
                    if (status === 'waiting' && appointment) this.ensureAppointmentQueueLink(appointment);
                    if (status === 'completed') this.waitingQueue = (this.waitingQueue || []).filter(entry => String(entry.id) !== String(item.id));
                    this.recordAudit('تغيير حالة قائمة الانتظار', item.patientName + ': ' + this.appointmentStatusLabel(status));
                    this.persistState();
                    this.queueCloudSync();
                },
                deleteAppointment(id) {
                    const appointment = (this.appointments || []).find(item => item.id === id);
                    if (!appointment || !confirm('حذف موعد ' + appointment.patientName + '؟')) return;
                    this.markLocalSyncChange();
                    const linkedQueueItems = (this.waitingQueue || []).filter(item => String(item.appointmentId ?? '') === String(id));
                    if (this.isOperationalDocumentSyncActive()) {
                        if (appointment.id != null) this.queueCloudDeleteOperation('appointments', appointment.id, appointment.patientId);
                        linkedQueueItems.forEach(item => {
                            if (item?.id != null) this.queueCloudDeleteOperation('waitingQueue', item.id, item.patientId ?? appointment.patientId);
                        });
                    }
                    this.appointments = this.appointments.filter(item => String(item.id) !== String(id));
                    this.waitingQueue = (this.waitingQueue || []).filter(item => String(item.appointmentId ?? '') !== String(id));
                    this.recordAudit('حذف موعد', appointment.patientName);
                    this.persistState();
                    this.queueCloudSync();
                },

                get waitingClinics() {
                    return [...new Set((this.waitingQueue || []).map(item => item.clinic || 'عيادة الطبيب').filter(Boolean))];
                },

                get filteredWaitingQueue() {
                    const query = (this.waitingSearch || '').trim().toLowerCase();
                    const filtered = (this.waitingQueue || []).filter(item => {
                        const patient = this.getPatientById(item.patientId);
                        const phone = this.getWaitingPatientPhone(item);
                        const searchable = [
                            item.patientName,
                            phone,
                            item.symptom,
                            item.clinic,
                            this.getWaitingPatientVisitType(item)
                        ].filter(Boolean).join(' ').toLowerCase();
                        const matchesQuery = !query || searchable.includes(query);
                        const matchesClinic = this.waitingClinicFilter === 'all' || (item.clinic || 'عيادة الطبيب') === this.waitingClinicFilter;
                        return matchesQuery && matchesClinic && (!!patient || !item.patientId);
                    });
                    return filtered.sort((a, b) => {
                        if (this.waitingSort === 'name') return (a.patientName || '').localeCompare(b.patientName || '', 'ar');
                        const aTime = new Date(a.createdAt || 0).getTime();
                        const bTime = new Date(b.createdAt || 0).getTime();
                        return this.waitingSort === 'newest' ? bTime - aTime : aTime - bTime;
                    });
                },

                get filteredPatients() {
                    const query = (this.patientSearch || '').trim().toLowerCase();
                    const filtered = (this.patients || []).filter(p => {
                        const records = Array.isArray(p.records) ? p.records : [];
                        const latestDate = records.reduce((latest, record) => record.date > latest ? record.date : latest, '');
                        const diagnosisText = records.map(record => [record.diagnosis, ...(record.diagnosisList || [])].filter(Boolean).join(' ')).join(' ');
                        const searchable = [p.fullName, p.phone, p.visitType, ...(p.selectedSymptoms || []), ...(p.selectedChronicDiseases || []), diagnosisText].filter(Boolean).join(' ').toLowerCase();
                        const matchesQuery = !query || searchable.includes(query);
                        const matchesVisitType = this.patientVisitTypeFilter === 'all' || (p.visitType || 'كشف') === this.patientVisitTypeFilter;
                        const matchesGender = this.patientGenderFilter === 'all' || (p.gender || '') === this.patientGenderFilter;
                        const matchesRecords = this.patientRecordsFilter === 'all'
                            || (this.patientRecordsFilter === 'has' && records.length > 0)
                            || (this.patientRecordsFilter === 'none' && records.length === 0);
                        const matchesDate = this.matchesArchiveDate(latestDate || p.createdAt || p.date, this.patientsYearFilter, this.patientsMonthFilter, this.patientsDayFilter);
                        return matchesQuery && matchesVisitType && matchesGender && matchesRecords && matchesDate;
                    });
                    return filtered.sort((a, b) => {
                        if (this.patientSort === 'name') return (a.fullName || '').localeCompare(b.fullName || '', 'ar');
                        const latestDate = patient => (patient.records || []).reduce((latest, record) => record.date > latest ? record.date : latest, '');
                        const aDate = latestDate(a);
                        const bDate = latestDate(b);
                        return this.patientSort === 'oldest' ? aDate.localeCompare(bDate) : bDate.localeCompare(aDate);
                    });
                },

                get paginatedPatients() {
                    const total = this.filteredPatients.length;
                    const maxPage = Math.max(1, Math.ceil(total / this.patientsPerPage));
                    const page = Math.min(Math.max(1, Number(this.patientsPage) || 1), maxPage);
                    const start = (page - 1) * this.patientsPerPage;
                    return this.filteredPatients.slice(start, start + this.patientsPerPage);
                },
                get patientPageCount() {
                    return Math.max(1, Math.ceil(this.filteredPatients.length / this.patientsPerPage));
                },
                get archiveYears() {
                    const years = new Set([String(new Date().getFullYear())]);
                    const addDate = date => {
                        const match = String(date || '').match(/^(\d{4})-/);
                        if (match) years.add(match[1]);
                    };
                    (this.patients || []).forEach(p => {
                        addDate(p.createdAt || p.date);
                        (p.records || []).forEach(record => addDate(record.date));
                    });
                    (this.prescriptions || []).forEach(record => addDate(record.date));
                    return [...years].sort((a, b) => Number(b) - Number(a));
                },
                matchesArchiveDate(date, year, month, day) {
                    if (year === 'all' && month === 'all' && day === 'all') return true;
                    const value = String(date || '');
                    if (!/^\d{4}-\d{2}-\d{2}/.test(value)) return false;
                    const [dateYear, dateMonth, dateDay] = value.slice(0, 10).split('-');
                    return (year === 'all' || dateYear === String(year))
                        && (month === 'all' || dateMonth === String(month).padStart(2, '0'))
                        && (day === 'all' || dateDay === String(day).padStart(2, '0'));
                },
                resetArchiveDateFilters(kind) {
                    if (kind === 'patients') {
                        this.patientsYearFilter = 'all';
                        this.patientsMonthFilter = 'all';
                        this.patientsDayFilter = 'all';
                        this.patientsPage = 1;
                    } else {
                        this.pharmacyYearFilter = 'all';
                        this.pharmacyMonthFilter = 'all';
                        this.pharmacyDayFilter = 'all';
                        this.pharmacyPage = 1;
                    }
                },
                get paginatedPrescriptionGroups() {
                    const total = this.prescriptionGroups.length;
                    const maxPage = Math.max(1, Math.ceil(total / this.pharmacyPerPage));
                    const page = Math.min(Math.max(1, Number(this.pharmacyPage) || 1), maxPage);
                    const start = (page - 1) * this.pharmacyPerPage;
                    return this.prescriptionGroups.slice(start, start + this.pharmacyPerPage);
                },
                get pharmacyPageCount() {
                    return Math.max(1, Math.ceil(this.prescriptionGroups.length / this.pharmacyPerPage));
                },

                resetWaitingFilters() {
                    this.waitingSearch = '';
                    this.waitingClinicFilter = 'all';
                    this.waitingSort = 'oldest';
                },

                resetPatientFilters() {
                    this.patientSearch = '';
                    this.patientVisitTypeFilter = 'all';
                    this.patientGenderFilter = 'all';
                    this.patientRecordsFilter = 'all';
                    this.patientSort = 'recent';
                    this.resetArchiveDateFilters('patients');
                },

                get patientFormSuggestions() {
                    if (this.editingPatient) return [];
                    const nameQuery = (this.patientForm.fullName || '').trim().toLowerCase();
                    const phoneQuery = (this.patientForm.phone || '').replace(/[^0-9]/g, '');
                    if (nameQuery.length < 2 && phoneQuery.length < 3) return [];
                    return this.patients.filter(p => {
                        const nameMatch = nameQuery.length >= 2 && p.fullName.toLowerCase().includes(nameQuery);
                        const phoneMatch = phoneQuery.length >= 3 && (p.phone || '').replace(/[^0-9]/g, '').includes(phoneQuery);
                        return nameMatch || phoneMatch;
                    }).slice(0, 5);
                },

                get upcomingFollowUps() {
                    const todayStr = new Date().toISOString().slice(0, 10);
                    const today = new Date(todayStr);
                    const items = [];
                    this.patients.forEach(p => {
                        (p.records || []).forEach(rec => {
                            if (!rec.nextFollowUpDate) return;
                            const followDate = new Date(rec.nextFollowUpDate);
                            if (isNaN(followDate)) return;
                            const diffDays = Math.round((followDate - today) / (1000 * 60 * 60 * 24));
                            if (diffDays < 0) return; // skip past follow-ups
                            let daysLabel = '';
                            if (diffDays === 0) daysLabel = 'اليوم';
                            else if (diffDays === 1) daysLabel = 'غداً';
                            else daysLabel = 'خلال ' + diffDays + ' أيام';
                            items.push({
                                patientId: p.id,
                                patientName: p.fullName,
                                phone: p.phone || '',
                                date: rec.nextFollowUpDate,
                                daysRemaining: diffDays,
                                daysLabel: daysLabel,
                                isUrgent: diffDays <= 2
                            });
                        });
                    });
                    return items.sort((a, b) => a.daysRemaining - b.daysRemaining);
                },

                get urgentFollowUps() {
                    return this.upcomingFollowUps.filter(item => item.isUrgent);
                },

                get filteredSymptomsMaster() {
                    if (!this.symptomSearchQuery) return this.symptomsList;
                    return this.symptomsList.filter(s => s.toLowerCase().includes(this.symptomSearchQuery.toLowerCase()));
                },

                get filteredChronicMaster() {
                    if (!this.chronicSearchQuery) return this.chronicDiseasesList;
                    return this.chronicDiseasesList.filter(c => c.toLowerCase().includes(this.chronicSearchQuery.toLowerCase()));
                },

                normalizeSearchText(value) {
                    return String(value || '')
                        .toLowerCase()
                        .replace(/[أإآٱ]/g, 'ا')
                        .replace(/ى/g, 'ي')
                        .replace(/ة/g, 'ه')
                        .replace(/[\u064B-\u065F\u0670]/g, '')
                        .trim();
                },

                get filteredDiagnosesMaster() {
                    const query = this.normalizeSearchText(this.diagnosisSearchQuery);
                    if (!query) return this.diagnosesMasterList;
                    return this.diagnosesMasterList.filter(d => this.normalizeSearchText(d).includes(query));
                },

                // اقتراحات قصيرة فوق قائمة التشخيصات: تضيف التشخيص بنقرة أو Enter دون تمرير القائمة الكاملة.
                get diagnosisAutocompleteSuggestions() {
                    const query = this.normalizeSearchText(this.diagnosisSearchQuery);
                    if (!query) return [];
                    return [...new Set(this.diagnosesMasterList || [])]
                        .filter(item => this.normalizeSearchText(item).includes(query))
                        .filter(item => !(this.newRecordForm.selectedDiagnosesList || []).includes(item))
                        .slice(0, 7);
                },

                get filteredLabTestsMaster() {
                    if (!this.labTestSearchQuery) return this.labTestsMasterList;
                    return this.labTestsMasterList.filter(t => t.toLowerCase().includes(this.labTestSearchQuery.toLowerCase()));
                },

                get filteredRadiologyMaster() {
                    if (!this.radiologySearchQuery) return this.radiologyMasterList;
                    return this.radiologyMasterList.filter(r => r.toLowerCase().includes(this.radiologySearchQuery.toLowerCase()));
                },

                get filteredVitalsMaster() {
                    if (!this.vitalSearchQuery) return this.vitalSignsMasterList;
                    return this.vitalSignsMasterList.filter(v => v.toLowerCase().includes(this.vitalSearchQuery.toLowerCase()));
                },

                get filteredMedicinesMaster() {
                    const query = this.normalizeSearchText(this.medicineSearchQuery);
                    if (!query) return this.medicinesMasterList.slice(0, 60);
                    const localMatches = this.medicinesMasterList.filter(m => this.normalizeSearchText(m).includes(query));
                    if (!this.egyptianMedicineArchiveLoaded || localMatches.length >= 12) return localMatches.slice(0, 60);
                    const archiveMatches = this.egyptianMedicineArchive.filter(item => this.normalizeSearchText([item.arabicName, item.englishName, item.scientificName, item.manufacturer, item.drugClass].filter(Boolean).join(' ')).includes(query));
                    const archiveNames = archiveMatches.map(item => item.arabicName || item.englishName || item.scientificName).filter(Boolean);
                    return [...new Set([...localMatches, ...archiveNames])].slice(0, 60);
                },

                // تعرض الأدوية المتكررة أولاً بما فيها الجرعة المحفوظة، ثم نتائج الأرشيف المصري.
                get medicineAutocompleteSuggestions() {
                    const query = this.normalizeSearchText(this.medicineSearchQuery);
                    if (!query) return [];
                    const results = [];
                    const usedNames = new Set();
                    const addResult = (name, timing = '', extraDosageNotes = '', source = 'أرشيف الدواء') => {
                        const normalized = String(name || '').trim();
                        if (!normalized || usedNames.has(normalized) || !this.normalizeSearchText(normalized).includes(query)) return;
                        if ((this.newRecordForm.selectedMedicinesWithDosage || []).some(item => item.name === normalized)) return;
                        usedNames.add(normalized);
                        results.push({ name: normalized, timing, extraDosageNotes, source });
                    };
                    (this.recurringMedicinesList || []).forEach(item => {
                        const parts = String(item || '').split(' — ').map(value => value.trim());
                        addResult(parts[0], parts[1] || '', parts.slice(2).join(' — ') || '', 'قائمة متكررة');
                    });
                    this.filteredMedicinesMaster.forEach(medicine => addResult(medicine));
                    return results.slice(0, 8);
                },

                get totalRevenue() {
                    return this.invoices
                        .filter(i => i.status === 'مدفوعة')
                        .reduce((sum, i) => sum + this.invoiceNetTotal(i), 0);
                },

                // مؤشرات لوحة القيادة تعتمد فقط الفواتير المدفوعة وصافيها بعد الخصم.
                get dashboardDateKey() {
                    const now = new Date();
                    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                },
                get dashboardRevenueToday() {
                    return (this.invoices || []).filter(invoice => invoice.status === 'مدفوعة' && String(invoice.date || '').slice(0, 10) === this.dashboardDateKey)
                        .reduce((sum, invoice) => sum + this.invoiceNetTotal(invoice), 0);
                },
                get dashboardRevenueMonth() {
                    const monthKey = this.dashboardDateKey.slice(0, 7);
                    return (this.invoices || []).filter(invoice => invoice.status === 'مدفوعة' && String(invoice.date || '').slice(0, 7) === monthKey)
                        .reduce((sum, invoice) => sum + this.invoiceNetTotal(invoice), 0);
                },
                get dashboardRevenueYear() {
                    const yearKey = this.dashboardDateKey.slice(0, 4);
                    return (this.invoices || []).filter(invoice => invoice.status === 'مدفوعة' && String(invoice.date || '').slice(0, 4) === yearKey)
                        .reduce((sum, invoice) => sum + this.invoiceNetTotal(invoice), 0);
                },
                get dashboardRevenueChart() {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    const paidInvoices = (this.invoices || []).filter(invoice => invoice.status === 'مدفوعة' && invoice.date);
                    const amountFor = key => paidInvoices
                        .filter(invoice => String(invoice.date || '').slice(0, key.length) === key)
                        .reduce((sum, invoice) => sum + this.invoiceNetTotal(invoice), 0);
                    let bars = [];
                    let label = 'آخر 7 أيام';
                    if (this.dashboardRevenueChartPeriod === 'weekly') {
                        bars = Array.from({ length: 7 }, (_, index) => {
                            const date = new Date(today);
                            date.setDate(today.getDate() - 6 + index);
                            const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                            return { key, label: date.toLocaleDateString('ar-EG', { weekday: 'short' }), value: amountFor(key), hint: date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }) };
                        });
                    } else if (this.dashboardRevenueChartPeriod === 'monthly') {
                        label = 'الشهر الحالي بحسب الأسابيع';
                        const start = new Date(today.getFullYear(), today.getMonth(), 1);
                        bars = Array.from({ length: 5 }, (_, index) => {
                            const weekStart = new Date(start);
                            weekStart.setDate(start.getDate() + (index * 7));
                            const weekEnd = new Date(weekStart);
                            weekEnd.setDate(weekStart.getDate() + 6);
                            const value = paidInvoices.filter(invoice => {
                                const d = new Date(`${String(invoice.date).slice(0, 10)}T00:00:00`);
                                return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d >= weekStart && d <= weekEnd;
                            }).reduce((sum, invoice) => sum + this.invoiceNetTotal(invoice), 0);
                            return { key: `week-${index + 1}`, label: `أ${index + 1}`, value, hint: `الأسبوع ${index + 1}` };
                        });
                    } else {
                        label = 'السنة الحالية بحسب الأشهر';
                        bars = Array.from({ length: 12 }, (_, index) => {
                            const date = new Date(today.getFullYear(), index, 1);
                            const key = `${today.getFullYear()}-${String(index + 1).padStart(2, '0')}`;
                            return { key, label: date.toLocaleDateString('ar-EG', { month: 'short' }), value: amountFor(key), hint: date.toLocaleDateString('ar-EG', { month: 'long' }) };
                        });
                    }
                    const maxValue = Math.max(...bars.map(bar => bar.value), 1);
                    const total = bars.reduce((sum, bar) => sum + bar.value, 0);
                    return { label, total, bars: bars.map(bar => ({ ...bar, height: Math.max(8, Math.round((bar.value / maxValue) * 100)) })) };
                },

                // Settings Management
                addMasterSymptom() {
                    if (this.newSymptomSetting.trim() && !this.symptomsList.includes(this.newSymptomSetting.trim())) {
                        this.symptomsList.push(this.newSymptomSetting.trim());
                        this.newSymptomSetting = '';
                        this.renderIcons();
                    }
                },
                removeMasterSymptom(index) { this.symptomsList.splice(index, 1); },

                addMasterChronic() {
                    if (this.newChronicSetting.trim() && !this.chronicDiseasesList.includes(this.newChronicSetting.trim())) {
                        this.chronicDiseasesList.push(this.newChronicSetting.trim());
                        this.newChronicSetting = '';
                        this.renderIcons();
                    }
                },
                removeMasterChronic(index) { this.chronicDiseasesList.splice(index, 1); },

                addMasterDiagnosis() {
                    if (this.newDiagnosisSetting.trim() && !this.diagnosesMasterList.includes(this.newDiagnosisSetting.trim())) {
                        this.diagnosesMasterList.push(this.newDiagnosisSetting.trim());
                        this.newDiagnosisSetting = '';
                        this.renderIcons();
                    }
                },
                removeMasterDiagnosis(index) { this.diagnosesMasterList.splice(index, 1); },
                normalizeRecurringPrescriptionLists(value) {
                    const usedIds = new Set();
                    return (Array.isArray(value) ? value : []).map((item, index) => {
                        if (!item || typeof item !== 'object') return null;
                        const diagnoses = [...new Set((Array.isArray(item.diagnoses) ? item.diagnoses : []).map(diagnosis => String(diagnosis || '').trim()).filter(Boolean))];
                        const notes = String(item.notes || '').trim();
                        const medicines = (Array.isArray(item.medicines) ? item.medicines : []).map(medicine => ({
                            name: String(medicine?.name || '').trim(),
                            timing: String(medicine?.timing || '').trim(),
                            extraDosageNotes: String(medicine?.extraDosageNotes || '').trim()
                        })).filter(medicine => medicine.name);
                        if (!diagnoses.length && !notes && !medicines.length) return null;
                        let id = String(item.id || '').trim() || `rx-template-legacy-${index + 1}`;
                        while (usedIds.has(id)) id = `${id}-${index + 1}`;
                        usedIds.add(id);
                        const fallbackName = diagnoses[0] || notes.slice(0, 42) || medicines[0]?.name || 'روشتة متكررة';
                        return { id, name: String(item.name || '').trim() || `قائمة: ${fallbackName}`, diagnoses, notes, medicines, createdAt: String(item.createdAt || ''), updatedAt: String(item.updatedAt || '') };
                    }).filter(Boolean);
                },
                saveRecurringItemsFromPrescription() {
                    const hasCurrentData = this.newRecordForm?.selectedDiagnosesList?.length || this.newRecordForm?.customDiagnosis || this.newRecordForm?.generalNotes || this.newRecordForm?.selectedMedicinesWithDosage?.length;
                    const source = hasCurrentData ? this.newRecordForm : (this.lastPrescriptionReusableData || {});
                    const diagnoses = [
                        ...(source.selectedDiagnosesList || []),
                        source.customDiagnosis || ''
                    ].map(value => String(value).trim()).filter(Boolean);
                    const notes = String(source.generalNotes || '').trim();
                    const medicineEntries = (source.selectedMedicinesWithDosage || []).map(item => ({ name: String(item?.name || '').trim(), timing: String(item?.timing || '').trim(), extraDosageNotes: String(item?.extraDosageNotes || '').trim() })).filter(item => item.name);
                    const medicines = medicineEntries.map(item => [item.name, item.timing, item.extraDosageNotes].filter(Boolean).join(' — '));
                    if (!diagnoses.length && !notes && !medicineEntries.length) {
                        alert('أدخل تشخيصاً أو ملاحظة أو دواءً في الروشتة أولاً، ثم احفظه في القوائم المتكررة.');
                        return;
                    }
                    const fallbackName = diagnoses[0] || notes.slice(0, 42) || medicineEntries[0]?.name || 'روشتة متكررة';
                    const listName = `قائمة: ${fallbackName}`;
                    const existingIndex = (this.recurringPrescriptionLists || []).findIndex(list => list.name === listName);
                    const now = new Date().toISOString();
                    const savedList = { id: existingIndex >= 0 ? this.recurringPrescriptionLists[existingIndex].id : `rx-template-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, name: listName, diagnoses, notes, medicines: medicineEntries, createdAt: existingIndex >= 0 ? this.recurringPrescriptionLists[existingIndex].createdAt : now, updatedAt: now };
                    if (existingIndex >= 0) this.recurringPrescriptionLists.splice(existingIndex, 1, savedList);
                    else this.recurringPrescriptionLists.push(savedList);
                    diagnoses.forEach(value => {
                        if (!this.diagnosesMasterList.includes(value)) this.diagnosesMasterList.push(value);
                    });
                    if (notes && !this.recurringNotesList.includes(notes)) this.recurringNotesList.push(notes);
                    medicines.forEach(value => {
                        if (!this.recurringMedicinesList.includes(value)) this.recurringMedicinesList.push(value);
                    });
                    this.selectedRecurringPrescriptionListId = savedList.id;
                    this.persistState();
                    this.queueCloudSync();
                    this.newRecurringNote = '';
                    this.newRecurringMedicine = '';
                    this.recordAudit(existingIndex >= 0 ? 'تحديث قائمة روشتة متكررة' : 'حفظ قائمة روشتة متكررة', `${listName} — تشخيصات: ${diagnoses.length}، أدوية: ${medicineEntries.length}`);
                    this.showFlashNotice(existingIndex >= 0 ? 'تم تحديث القائمة المتكررة.' : 'تم حفظ القائمة المتكررة وظهرت أعلى الروشتة.');
                },
                applyRecurringPrescriptionList(listId) {
                    const savedList = (this.recurringPrescriptionLists || []).find(list => list.id === listId);
                    if (!savedList) return;
                    const normalized = this.normalizeRecurringPrescriptionLists([savedList])[0];
                    if (!normalized) return;
                    this.newRecordForm.selectedDiagnosesList = [...normalized.diagnoses];
                    this.newRecordForm.customDiagnosis = '';
                    this.newRecordForm.generalNotes = normalized.notes;
                    this.newRecordForm.selectedMedicinesWithDosage = normalized.medicines.map(medicine => ({ ...medicine }));
                    this.selectedRecurringPrescriptionListId = normalized.id;
                    this.diagnosisSearchQuery = '';
                    this.medicineSearchQuery = '';
                    this.diagnosisSuggestionsOpen = false;
                    this.medicineSuggestionsOpen = false;
                    this.showFlashNotice(`تم تحميل «${normalized.name}» في الروشتة.`);
                    this.$nextTick(() => this.renderIcons());
                },
                openRecurringPrescriptionListEditor(listId) {
                    const savedList = (this.recurringPrescriptionLists || []).find(list => list.id === listId);
                    const normalized = this.normalizeRecurringPrescriptionLists(savedList ? [savedList] : [])[0];
                    if (!normalized) return;
                    this.editingRecurringPrescriptionListId = normalized.id;
                    this.recurringPrescriptionListDraft = {
                        name: normalized.name,
                        diagnosesText: normalized.diagnoses.join('\n'),
                        notes: normalized.notes,
                        medicines: normalized.medicines.map(medicine => ({ ...medicine }))
                    };
                    this.$nextTick(() => this.renderIcons());
                },
                closeRecurringPrescriptionListEditor() {
                    this.editingRecurringPrescriptionListId = '';
                    this.recurringPrescriptionListDraft = { name: '', diagnosesText: '', notes: '', medicines: [] };
                },
                addRecurringPrescriptionListMedicine() {
                    this.recurringPrescriptionListDraft.medicines.push({ name: '', timing: '', extraDosageNotes: '' });
                },
                removeRecurringPrescriptionListMedicine(index) {
                    this.recurringPrescriptionListDraft.medicines.splice(index, 1);
                },
                saveRecurringPrescriptionListEditor() {
                    const listId = this.editingRecurringPrescriptionListId;
                    const index = (this.recurringPrescriptionLists || []).findIndex(list => list.id === listId);
                    if (index < 0) return this.closeRecurringPrescriptionListEditor();
                    const draft = this.recurringPrescriptionListDraft || {};
                    const diagnoses = [...new Set(String(draft.diagnosesText || '').split(/[\n،,]/).map(value => value.trim()).filter(Boolean))];
                    const notes = String(draft.notes || '').trim();
                    const medicines = (Array.isArray(draft.medicines) ? draft.medicines : []).map(medicine => ({
                        name: String(medicine?.name || '').trim(),
                        timing: String(medicine?.timing || '').trim(),
                        extraDosageNotes: String(medicine?.extraDosageNotes || '').trim()
                    })).filter(medicine => medicine.name);
                    if (!diagnoses.length && !notes && !medicines.length) {
                        alert('أدخل تشخيصاً أو ملاحظة أو دواءً واحداً على الأقل قبل حفظ القائمة.');
                        return;
                    }
                    const current = this.recurringPrescriptionLists[index];
                    const fallbackName = diagnoses[0] || notes.slice(0, 42) || medicines[0]?.name || 'روشتة متكررة';
                    const name = String(draft.name || '').trim() || `قائمة: ${fallbackName}`;
                    const updatedList = { ...current, name, diagnoses, notes, medicines, updatedAt: new Date().toISOString() };
                    this.recurringPrescriptionLists.splice(index, 1, updatedList);
                    diagnoses.forEach(value => { if (!this.diagnosesMasterList.includes(value)) this.diagnosesMasterList.push(value); });

                savePatient() {
                    if (this.cloudSyncEnabled && navigator.onLine && this.cloudAuthReady && this.cloudMembershipReady && (!this.cloudServerHydrated && !this.isOperationalDocumentSyncActive())) {
                        this.cloudStatus = 'connecting';
                        alert('جارٍ تحميل بيانات العيادة من السحابة. انتظر اكتمال الاتصال ثم احفظ الزيارة مرة أخرى حتى تظهر على جميع الأجهزة.');
                        return;
                    }
                    if (!this.patientForm.fullName.trim()) return;
                    const validPhone = this.validateAndNormalizePhone(this.patientForm.phone);
                    if (validPhone === null) return;
                    this.patientForm.phone = validPhone;

                    const visitPrice = Number(this.visitTypePrices[this.patientForm.visitType] || 300);

                    if (this.editingPatient) {
                        // Pure info correction from the patients list "edit" action — no new visit/invoice.
                        Object.assign(this.editingPatient, this.patientForm);
                    } else if (this.matchedExistingPatient) {
                        // The doctor picked an already-registered patient from the smart suggestions —
                        // update their info on the SAME existing file and register this as a new visit,
                        // instead of creating a duplicate patient card.
                        const p = this.matchedExistingPatient;
                        Object.assign(p, this.patientForm);
                        if (!p.records) p.records = [];

                        const waitingQueueId = 'WQ-' + Date.now();
                        const invoiceId = 'INV-' + Math.floor(1000 + Math.random() * 9000);
                        this.waitingQueue.unshift({
                            id: waitingQueueId,
                            status: 'waiting',
                            patientId: p.id,
                            patientName: p.fullName,
                            visitType: p.visitType,
                            invoiceId,
                            symptom: (p.selectedSymptoms && p.selectedSymptoms[0]) ? p.selectedSymptoms[0] : ('زيارة ' + p.visitType),
                            clinic: 'عيادة الطبيب',
                            createdAt: new Date().toISOString()
                        });

                        this.invoices.unshift({
                            id: invoiceId,
                            patientId: p.id,
                            waitingQueueId,
                            source: 'waiting_checkin',
                            patientName: p.fullName,
                            serviceName: `رسوم ${p.visitType} طبي`,
                            amount: visitPrice,
                            discount: 0,
                            tax: 0,
                            total: visitPrice,
                            date: new Date().toISOString().split('T')[0],
                            status: 'مدفوعة'
                        });

                        // Move the returning patient to the top of the list so the front desk sees them first.
                        this.patients = [p, ...this.patients.filter(existing => existing.id !== p.id)];
                    } else {
                        const newP = {
                            id: Date.now(),
                            ...this.patientForm,
                            records: []
                        };
                        this.patients.unshift(newP);
                        const waitingQueueId = 'WQ-' + Date.now();
                        const invoiceId = 'INV-' + Math.floor(1000 + Math.random() * 9000);
                        this.waitingQueue.unshift({
                            id: waitingQueueId,
                            status: 'waiting',
                            patientId: newP.id,
                            patientName: newP.fullName,
                            visitType: newP.visitType,
                            invoiceId,
                            symptom: (newP.selectedSymptoms && newP.selectedSymptoms[0]) ? newP.selectedSymptoms[0] : ('زيارة ' + newP.visitType),
                            clinic: 'عيادة الطبيب',
                            createdAt: new Date().toISOString()
                        });

                        this.invoices.unshift({
                            id: invoiceId,
                            patientId: newP.id,
                            waitingQueueId,
                            source: 'waiting_checkin',
                            patientName: newP.fullName,
                            serviceName: `رسوم ${newP.visitType} طبي`,
                            amount: visitPrice,
                            discount: 0,
                            tax: 0,
                            total: visitPrice,
                            date: new Date().toISOString().split('T')[0],
                            status: 'مدفوعة'
                        });
                    }
                    const savedPatient = this.editingPatient || this.matchedExistingPatient || this.patients[0];
                    const addedWaitingItem = this.editingPatient ? null : (this.waitingQueue || [])[0];
                    if (savedPatient) {
                        this.recentRegisteredPatients = [{ id: savedPatient.id, name: savedPatient.fullName, visitType: savedPatient.visitType, createdAt: new Date().toISOString() }, ...(this.recentRegisteredPatients || [])].slice(0, 8);
                    }
                    if (addedWaitingItem && String(addedWaitingItem.patientId ?? '') === String(savedPatient?.id ?? '')) this.announceWaitingArrival(addedWaitingItem, 'visit_registration');
                    this.markLocalSyncChange();
                    this.persistState();
                    this.queueCloudSync(0);
                    this.showFlashNotice(`تم تسجيل زيارة ${savedPatient?.fullName || ''} وتوليد الفاتورة`);
                    this.matchedExistingPatient = null;
                    this.editingPatient = null;
                    this.renderIcons();
